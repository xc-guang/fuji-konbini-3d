<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>雨夜富士山与日式便利店街角 — 3D微缩模型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080b14;
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      color: #e9eefb;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }

    /* Ultra-clean transparent glass collector HUD */
    .hud-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px) saturate(135%);
      -webkit-backdrop-filter: blur(10px) saturate(135%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .hud-btn {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: rgba(248, 250, 252, 0.92);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
    }
    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.45);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .hud-btn:active {
      transform: translateY(0px) scale(0.97);
    }

    /* Active theme accents (transparent luminous borders) */
    .hud-btn.active-cam {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(125, 211, 252, 0.85);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .hud-btn.active-weather {
      background: rgba(129, 140, 248, 0.16);
      border-color: rgba(165, 180, 252, 0.85);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .hud-btn.active-volcano {
      background: rgba(249, 115, 22, 0.16);
      border-color: rgba(253, 186, 116, 0.88);
      color: #fff7ed;
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .hud-btn.active-play {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(254, 202, 202, 0.85);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
    .hud-btn.primary-play {
      background: rgba(14, 165, 233, 0.16);
      border-color: rgba(165, 243, 252, 0.78);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
    .hud-btn.primary-play:hover {
      background: rgba(34, 211, 238, 0.24);
      border-color: rgba(186, 230, 253, 0.95);
    }

    .hud-panel-transition {
      transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .hud-hidden {
      opacity: 0 !important;
      transform: translateY(16px) !important;
      pointer-events: none !important;
    }
    .hud-hidden-top {
      opacity: 0 !important;
      transform: translateY(-14px) !important;
      pointer-events: none !important;
    }
  </style>

<body>
  <!-- ===================================================================== -->

      <!-- Row 2: Weather System & Volcano FX Controls -->

  <!-- ===================================================================== -->
  <!-- THREE.JS 3D DIORAMA APPLICATION                                       -->
  <!-- ===================================================================== -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // =========================================================================
    // 1. GLOBAL STATE & ANIMATION REGISTRIES
    // =========================================================================
    let renderer, scene, camera, controls, composer, bloomPass;
    let usePostProcessing = true;

    const dioramaRoot = new THREE.Group();
    const animatedRipples = [];
    const neonFlickerItems = [];
    const shimmerReflections = [];
    const acFanMeshes = [];
    const acVaneMeshes = [];
    const petAnimTargets = [];

    // Lighting & atmosphere references for dynamic weather / volcano / build playback
    const sceneLights = {
      hemi: null,
      moon: null,
      rim: null,
      lightning: null,
      crater: null,
      volcanoSkyTint: null,
      managedLights: [],     // { light, baseIntensity } ramped in Build Stage 7
      managedEmissives: []   // { mat, baseIntensity } ramped in Build Stage 7
    };

    const streetMaterials = {
      road: null,
      puddle: null,
      stripe: null
    };

    // Weather state
    let currentWeather = 'rain'; // 'rain' | 'storm' | 'snow' | 'clear'
    let currentVolcano = 'active'; // 'dormant' | 'active' | 'eruption'
    let lightningTimer = 2.8;
    let lightningFlash = 0;
    let targetExposure = 1.04;
    let targetBloomThreshold = 0.88;

    // Particle & sky lightning systems
    let rainSystem = null, rainPositions = null, rainVelocities = null, rainMat = null;
    let snowSystem = null, snowPositions = null, snowPhases = null, snowMat = null;
    let starSystem = null, starMat = null;
    let fireflySystem = null, fireflyBase = null, fireflyMat = null;
    const lightningBolts = [];
    let activeLightningBolt = 0;

    // Volcano FX state & pools
    const volcanoFX = {
      craterPos: new THREE.Vector3(-1.15, 7.62, -4.55),
      magmaPoolMat: null,
      magmaPoolMesh: null,
      fissureMats: [],
      smokePuffs: [],
      emberSystem: null,
      emberPositions: null,
      emberData: [],
      emberMat: null,
      lavaBombs: [],
      tremorStrength: 0
    };

    // Backdrop canvas for smooth weather/volcano sky mood tinting
    let backdropCanvas, backdropCtx, backdropTex;
    const skyColorsCurrent = {
      inner: new THREE.Color('#192340'),
      mid: new THREE.Color('#10172b'),
      outer: new THREE.Color('#060912')
    };
    const skyColorsTarget = {
      inner: new THREE.Color('#192340'),
      mid: new THREE.Color('#10172b'),
      outer: new THREE.Color('#060912')
    };

    // Camera transition state (smooth spherical orbit interpolation)
    const camAnim = {
      active: false,
      elapsed: 0,
      duration: 1.55,
      startTarget: new THREE.Vector3(),
      endTarget: new THREE.Vector3(),
      startSph: new THREE.Spherical(),
      endSph: new THREE.Spherical(),
      dTheta: 0
    };

    // 7-Stage Modeling / Build-Up Playback Engine
    const BUILD_STAGE_NAMES = [
      '阶段 1/7 · 底座成型',
      '阶段 2/7 · 街道路面',
      '阶段 3/7 · 富士山体',
      '阶段 4/7 · 山林鸟居',
      '阶段 5/7 · 便利店建构',
      '阶段 6/7 · 街角细节',
      '阶段 7/7 · 灯光与特效'
    ];
    const buildStages = Array.from({ length: 7 }, () => []);
    const buildState = {
      mode: 'idle', // 'idle' | 'playing' | 'paused'
      time: 0,
      stageDurations: [0.65, 0.70, 0.75, 1.05, 1.25, 1.25, 0.75],
      totalDuration: 0,
      fxMultiplier: 1.0 // Controls Stage 7 smooth fade-in of lights, weather & volcano FX
    };
    buildState.totalDuration = buildState.stageDurations.reduce((a, b) => a + b, 0);

    /**
     * Registers an Object3D into one of the 7 build-up animation stages.
     * Stores its pristine final transform so the elastic pop-in / drop-in animation is 100% exact.
     */
    function registerBuildItem(stageIdx, obj, popMode = 'pop', dropHeight = 1.6) {
      buildStages[stageIdx].push({
        obj,
        targetPos: obj.position.clone(),
        targetScale: obj.scale.clone(),
        popMode,
        dropHeight
      });
    }

    function registerManagedLight(light) {
      sceneLights.managedLights.push({ light, baseIntensity: light.intensity });
    }

    function registerManagedEmissive(mat) {
      sceneLights.managedEmissives.push({ mat, baseIntensity: mat.emissiveIntensity });
    }

    // Seeded pseudo-random helper for deterministic miniature placement
    let randSeed = 42087;
    function seededRandom() {
      randSeed = (randSeed * 16807) % 2147483647;
      return (randSeed - 1) / 2147483646;
    }

    // Easing utilities
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function easeInOutQuint(t) {
      return t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2;
    }
    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    // =========================================================================
    // 2. CEL-SHADING MATERIALS, OUTLINES & PROCEDURAL TEXTURES
    // =========================================================================

    function initDynamicBackdrop() {
      backdropCanvas = document.createElement('canvas');
      backdropCanvas.width = 512;
      backdropCanvas.height = 512;
      backdropCtx = backdropCanvas.getContext('2d');
      backdropTex = new THREE.CanvasTexture(backdropCanvas);
      backdropTex.colorSpace = THREE.SRGBColorSpace;
      redrawBackdrop(0);
      return backdropTex;
    }

    function redrawBackdrop(flashBoost = 0) {
      const cIn = skyColorsCurrent.inner.clone();
      const cMid = skyColorsCurrent.mid.clone();
      const cOut = skyColorsCurrent.outer.clone();
      if (flashBoost > 0.005) {
        const flashCol = new THREE.Color('#8cb8ff');
        cIn.lerp(flashCol, Math.min(0.65, flashBoost * 0.6));
        cMid.lerp(flashCol, Math.min(0.45, flashBoost * 0.42));
      }
      const grad = backdropCtx.createRadialGradient(256, 224, 30, 256, 256, 350);
      grad.addColorStop(0.0, `#${cIn.getHexString()}`);
      grad.addColorStop(0.48, `#${cMid.getHexString()}`);
      grad.addColorStop(1.0, `#${cOut.getHexString()}`);
      backdropCtx.fillStyle = grad;
      backdropCtx.fillRect(0, 0, 512, 512);
      backdropTex.needsUpdate = true;
    }

    /**
     * Generates crisp stepped cel-shading gradient maps (RGBAFormat for universal WebGL support).
     */
    function createToonGradientMap(steps = [82, 146, 208, 255]) {
      const width = steps.length;
      const data = new Uint8Array(width * 4);
      for (let i = 0; i < width; i++) {
        const v = steps[i];
        data[i * 4 + 0] = v;
        data[i * 4 + 1] = v;
        data[i * 4 + 2] = v;
        data[i * 4 + 3] = 255;
      }
      const tex = new THREE.DataTexture(data, width, 1, THREE.RGBAFormat);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      tex.needsUpdate = true;
      return tex;
    }

    const toonGrad4 = createToonGradientMap([84, 148, 210, 255]);
    const toonGrad3 = createToonGradientMap([94, 178, 255]);

    function makeToonMat(color, opts = {}) {
      return new THREE.MeshToonMaterial({
        color,
        gradientMap: opts.gradientMap || toonGrad4,
        ...opts
      });
    }

    /**
     * Computes averaged smooth normals per shared vertex position on a cloned geometry,
     * giving seamless anime inverted-hull outlines even across sharp box corners.
     */
    function createSmoothOutlineGeometry(srcGeometry) {
      const geom = srcGeometry.clone();
      const pos = geom.attributes.position;
      if (!geom.attributes.normal) geom.computeVertexNormals();
      const norm = geom.attributes.normal;
      const normalMap = new Map();

      for (let i = 0; i < pos.count; i++) {
        const key = `${Math.round(pos.getX(i) * 1000)}_${Math.round(pos.getY(i) * 1000)}_${Math.round(pos.getZ(i) * 1000)}`;
        let acc = normalMap.get(key);
        if (!acc) {
          acc = new THREE.Vector3();
          normalMap.set(key, acc);
        }
        acc.x += norm.getX(i);
        acc.y += norm.getY(i);
        acc.z += norm.getZ(i);
      }

      const smoothNormals = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        const key = `${Math.round(pos.getX(i) * 1000)}_${Math.round(pos.getY(i) * 1000)}_${Math.round(pos.getZ(i) * 1000)}`;
        const v = normalMap.get(key).clone().normalize();
        smoothNormals[i * 3 + 0] = v.x;
        smoothNormals[i * 3 + 1] = v.y;
        smoothNormals[i * 3 + 2] = v.z;
      }
      geom.setAttribute('smoothNormal', new THREE.BufferAttribute(smoothNormals, 3));
      return geom;
    }

    const outlineMatCache = new Map();
    function getOutlineMaterial(thickness = 0.032, colorHex = 0x0b0e1c) {
      const key = `${thickness.toFixed(4)}_${colorHex}`;
      if (outlineMatCache.has(key)) return outlineMatCache.get(key);

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uOutlineWidth: { value: thickness },
          uColor: { value: new THREE.Color(colorHex) }
        },
        vertexShader: `
          attribute vec3 smoothNormal;
          uniform float uOutlineWidth;
          void main() {
            vec3 extruded = position + smoothNormal * uOutlineWidth;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(extruded, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          void main() {
            gl_FragColor = vec4(uColor, 1.0);
          }
        `,
        side: THREE.BackSide,
        depthWrite: true
      });
      outlineMatCache.set(key, mat);
      return mat;
    }

    function addOutline(mesh, thickness = 0.032, colorHex = 0x0b0e1c) {
      const outGeom = createSmoothOutlineGeometry(mesh.geometry);
      const outMesh = new THREE.Mesh(outGeom, getOutlineMaterial(thickness, colorHex));
      outMesh.renderOrder = -1;
      mesh.add(outMesh);
      return outMesh;
    }

    function createRoundedBox(w, h, d, r = 0.04) {
      const radius = Math.min(r, w * 0.25, h * 0.25, d * 0.25);
      const shape = new THREE.Shape();
      const hw = w / 2 - radius;
      const hd = d / 2 - radius;
      shape.moveTo(-hw, -hd - radius);
      shape.lineTo(hw, -hd - radius);
      shape.quadraticCurveTo(hw + radius, -hd - radius, hw + radius, -hd);
      shape.lineTo(hw + radius, hd);
      shape.quadraticCurveTo(hw + radius, hd + radius, hw, hd + radius);
      shape.lineTo(-hw, hd + radius);
      shape.quadraticCurveTo(-hw - radius, hd + radius, -hw - radius, hd);
      shape.lineTo(-hw - radius, -hd);
      shape.quadraticCurveTo(-hw - radius, -hd - radius, -hw, -hd - radius);

      const geom = new THREE.ExtrudeGeometry(shape, {
        depth: Math.max(0.01, h - radius * 2),
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: radius,
        bevelThickness: radius
      });
      geom.rotateX(Math.PI / 2);
      geom.center();
      return geom;
    }

    // =========================================================================
    // 4. STAGE 1: THICK SQUARE DARK SOIL & VOLCANIC ROCK PEDESTAL + CROSS-SECTION
    // =========================================================================
    function buildPedestal() {
      const pedGroup = new THREE.Group();

      // Matte collectible plinth base trim at the very bottom
      const plinthGeom = createRoundedBox(15.35, 0.44, 15.35, 0.08);
      const plinthMesh = new THREE.Mesh(plinthGeom, makeToonMat(0x111420));
      plinthMesh.position.set(0, -2.58, 0);
      addOutline(plinthMesh, 0.035, 0x05070d);
      pedGroup.add(plinthMesh);
      registerBuildItem(0, plinthMesh, 'rise', 1.4);

      // Sculpted dark volcanic rock & soil strata body
      const rockGeom = new THREE.BoxGeometry(15.72, 2.04, 15.72, 18, 6, 18);
      const pos = rockGeom.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);
        const onSideX = Math.abs(Math.abs(x) - 7.86) < 0.05;
        const onSideZ = Math.abs(Math.abs(z) - 7.86) < 0.05;
        if (onSideX || onSideZ) {
          const normY = (y + 1.02) / 2.04;
          const taper = 1.0 - (1.0 - normY) * 0.035;
          const wave =
            Math.sin(x * 1.15 + y * 2.1) * 0.14 +
            Math.cos(z * 1.35 - y * 1.7) * 0.14 +
            Math.sin((x + z) * 2.4 + y * 3.0) * 0.06;
          x = x * taper + (onSideX ? Math.sign(x) * wave : 0);
          z = z * taper + (onSideZ ? Math.sign(z) * wave : 0);
          pos.setXYZ(i, x, y, z);
        }
      }
      rockGeom.computeVertexNormals();

      const colors = new Float32Array(pos.count * 3);
      const colTopSoil = new THREE.Color(0x362a2a);
      const colMidSoil = new THREE.Color(0x28232d);
      const colMidRock = new THREE.Color(0x1f2333);
      const colDeepRock = new THREE.Color(0x151825);
      const tmpC = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const t = THREE.MathUtils.clamp((y + 1.02) / 2.04 + Math.sin(x * 0.65 + z * 0.55) * 0.07, 0, 1);
        if (t > 0.78) tmpC.copy(colMidSoil).lerp(colTopSoil, (t - 0.78) / 0.22);
        else if (t > 0.50) tmpC.copy(colMidRock).lerp(colMidSoil, (t - 0.50) / 0.28);
        else tmpC.copy(colDeepRock).lerp(colMidRock, t / 0.50);
        colors[i * 3 + 0] = tmpC.r;
        colors[i * 3 + 1] = tmpC.g;
        colors[i * 3 + 2] = tmpC.b;
      }
      rockGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const rockMesh = new THREE.Mesh(
        rockGeom,
        makeToonMat(0xffffff, { vertexColors: true, flatShading: true })
      );
      rockMesh.position.set(0, -1.36, 0);
      rockMesh.receiveShadow = true;
      rockMesh.castShadow = true;
      addOutline(rockMesh, 0.045, 0x070912);
      pedGroup.add(rockMesh);
      registerBuildItem(0, rockMesh, 'rise', 1.6);

      // Top dark soil / asphalt cap slab
      const capMesh = new THREE.Mesh(createRoundedBox(16.0, 0.36, 16.0, 0.08), makeToonMat(0x232634));
      capMesh.position.set(0, -0.18, 0);
      capMesh.receiveShadow = true;
      capMesh.castShadow = true;
      addOutline(capMesh, 0.04, 0x090b14);
      pedGroup.add(capMesh);
      registerBuildItem(0, capMesh, 'drop', 1.2);

      // Cross-section details: embedded pebbles/rocks & buried concrete storm drainage pipe end!
      const crossDetails = new THREE.Group();
      const chunkMat = makeToonMat(0x2d3144, { flatShading: true });
      const pebbleMat = makeToonMat(0x4b4652, { flatShading: true });

      const chunkCoords = [
        [-7.85, -1.2, 4.2, 0.62], [-7.85, -1.6, -2.5, 0.70], [7.85, -1.3, 3.1, 0.65],
        [7.85, -1.1, -3.8, 0.58], [3.5, -1.45, 7.85, 0.60], [-3.8, -1.25, 7.85, 0.68],
        [-2.2, -1.5, -7.85, 0.65], [4.2, -1.3, -7.85, 0.62],
        // Smaller underground pebbles visible in strata
        [1.1, -0.82, 7.84, 0.24], [-1.6, -1.78, 7.84, 0.28], [7.84, -0.88, -0.9, 0.26],
        [7.84, -1.72, 5.2, 0.24], [-5.8, -0.86, 7.84, 0.22]
      ];
      chunkCoords.forEach(([cx, cy, cz, s], idx) => {
        const m = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), idx >= 8 ? pebbleMat : chunkMat);
        m.position.set(cx, cy, cz);
        m.scale.set(0.68, 0.78, 1.08);
        m.rotation.set(seededRandom(), seededRandom(), seededRandom());
        if (s > 0.4) addOutline(m, 0.028, 0x080a13);
        crossDetails.add(m);
      });

      // Buried circular concrete drainage pipe emerging from the right-side cross-section (aligned with road drain)
      const pipeGroup = new THREE.Group();
      const pipeOuter = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.42, 0.45, 16),
        makeToonMat(0x5d6578)
      );
      pipeOuter.rotation.z = Math.PI / 2;
      addOutline(pipeOuter, 0.022, 0x090c16);
      const pipeVoid = new THREE.Mesh(
        new THREE.CylinderGeometry(0.30, 0.30, 0.48, 16),
        new THREE.MeshBasicMaterial({ color: 0x060810 })
      );
      pipeVoid.rotation.z = Math.PI / 2;
      pipeGroup.add(pipeOuter, pipeVoid);
      pipeGroup.position.set(7.82, -0.95, 3.74);
      crossDetails.add(pipeGroup);

      // Second smaller utility conduit pipe emerging on front cross-section
      const conduitPipe = pipeGroup.clone();
      conduitPipe.scale.setScalar(0.62);
      conduitPipe.rotation.y = Math.PI / 2;
      conduitPipe.position.set(-0.55, -0.85, 7.84);
      crossDetails.add(conduitPipe);

      pedGroup.add(crossDetails);
      registerBuildItem(0, crossDetails, 'pop');

      dioramaRoot.add(pedGroup);
    }

    // 5. STAGE 3 & 4: MOUNT FUJI, VOLCANO CRATER FX, TRAIL, PINES & TORII GATES
    // =========================================================================
    const FUJI_CENTER = new THREE.Vector2(-1.15, -4.55);
    const FUJI_BASE_R = 5.65;
    const FUJI_PEAK_H = 7.75;

    function getFujiHeight(wx, wz) {
      const dx = wx - FUJI_CENTER.x;
      const dz = wz - FUJI_CENTER.y;
      const dist = Math.sqrt(dx * dx + dz * dz);
      const angle = Math.atan2(dz, dx);

      const radialMod = 1.0 + Math.cos(angle * 2.0 + 0.4) * 0.05 + Math.sin(angle * 5.0) * 0.025;
      const rNorm = dist / (FUJI_BASE_R * radialMod);
      if (rNorm >= 1.0) return 0;

      const summitR = 0.165;
      let hNorm;
      if (rNorm <= summitR) {
        // Deeper sculpted volcanic crater bowl right at Mount Fuji's peak
        const craterT = rNorm / summitR;
        hNorm = 1.0 - (1.0 - craterT * craterT) * 0.085;
      } else {
        const t = (rNorm - summitR) / (1.0 - summitR);
        hNorm = Math.pow(1.0 - t, 1.50);
      }

      const ridgeStrength = Math.sin(rNorm * Math.PI) * 0.16;
      const ridges =
        (Math.sin(angle * 9.0 + 0.5) * 0.55 + Math.cos(angle * 15.0 - 0.8) * 0.35) *
        ridgeStrength;

      return Math.max(0, hNorm * FUJI_PEAK_H + ridges);
    }

    function buildMountFujiScene() {
      const fujiGroup = new THREE.Group();

      // --- STAGE 3: Mount Fuji Terrain Body + Snow Cap + Volcanic Crater ---
      const radialSegs = 72;
      const ringSegs = 46;
      const positions = [];
      const colors = [];
      const indices = [];

      const fujiToonGrad = createToonGradientMap([112, 162, 208, 242]);
      const colSnowBright = new THREE.Color(0xb6cbe4);
      const colSnowTint = new THREE.Color(0x88a1c4);
      const colCraterScorch = new THREE.Color(0x2a1822);
      const colUpperRock = new THREE.Color(0x313e5e);
      const colMidSlope = new THREE.Color(0x23304d);
      const colForestBase = new THREE.Color(0x1b2d3b);

      for (let r = 0; r <= ringSegs; r++) {
        const frac = r / ringSegs;
        for (let a = 0; a <= radialSegs; a++) {
          const theta = (a / radialSegs) * Math.PI * 2;
          const radialMod = 1.0 + Math.cos(theta * 2.0 + 0.4) * 0.05 + Math.sin(theta * 5.0) * 0.025;
          let wx = FUJI_CENTER.x + Math.cos(theta) * frac * FUJI_BASE_R * radialMod;
          let wz = FUJI_CENTER.y + Math.sin(theta) * frac * FUJI_BASE_R * radialMod;

          wx = THREE.MathUtils.clamp(wx, -7.82, 5.4);
          wz = THREE.MathUtils.clamp(wz, -7.82, 0.8);

          const wy = r === ringSegs ? -0.02 : getFujiHeight(wx, wz);
          positions.push(wx, wy, wz);

          const snowline =
            4.85 +
            Math.sin(theta * 6.0 + 0.3) * 0.30 +
            Math.cos(theta * 11.0 - 0.9) * 0.14 +
            Math.sin(theta * 3.0) * 0.12;

          const c = new THREE.Color();
          if (frac < 0.155) {
            // Charred dark volcanic rock inside the crater bowl, blending into snow at the rim
            const ct = THREE.MathUtils.smoothstep(frac, 0.095, 0.155);
            c.copy(colCraterScorch).lerp(colSnowBright, ct);
          } else if (wy >= snowline) {
            const st = THREE.MathUtils.smoothstep(wy, snowline, snowline + 0.95);
            c.copy(colSnowTint).lerp(colSnowBright, st);
          } else if (wy >= 2.2) {
            const mt = THREE.MathUtils.clamp((wy - 2.2) / (snowline - 2.2), 0, 1);
            c.copy(colMidSlope).lerp(colUpperRock, mt);
          } else {
            const bt = THREE.MathUtils.clamp(wy / 2.2, 0, 1);
            c.copy(colForestBase).lerp(colMidSlope, bt);
          }
          colors.push(c.r, c.g, c.b);
        }
      }

      const stride = radialSegs + 1;
      for (let r = 0; r < ringSegs; r++) {
        for (let a = 0; a < radialSegs; a++) {
          const i0 = r * stride + a;
          const i1 = i0 + 1;
          const i2 = (r + 1) * stride + a;
          const i3 = i2 + 1;
          indices.push(i0, i2, i1);
          indices.push(i1, i2, i3);
        }
      }

      const fujiGeom = new THREE.BufferGeometry();
      fujiGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      fujiGeom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      fujiGeom.setIndex(indices);
      fujiGeom.computeVertexNormals();

      const storeClipCondition =
        'vStoreClipPos.x > -5.50 && vStoreClipPos.x < 1.70 && vStoreClipPos.z > -1.45 && vStoreClipPos.z < 1.85 && vStoreClipPos.y < 3.36';

      const fujiMat = makeToonMat(0xffffff, { vertexColors: true, gradientMap: fujiToonGrad });
      fujiMat.customProgramCacheKey = () => 'fuji-store-clip';
      fujiMat.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vStoreClipPos;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvStoreClipPos = position;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vStoreClipPos;')
          .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>\nif (${storeClipCondition}) discard;`);
      };

      const fujiMesh = new THREE.Mesh(fujiGeom, fujiMat);
      fujiMesh.receiveShadow = true;
      fujiMesh.castShadow = true;

      // Dedicated clipped outline so the mountain silhouette embeds behind the store without entering the interior
      const fujiOutlineGeom = createSmoothOutlineGeometry(fujiGeom);
      const fujiOutlineMat = new THREE.ShaderMaterial({
        uniforms: {
          uOutlineWidth: { value: 0.045 },
          uColor: { value: new THREE.Color(0x0a0d1a) }
        },
        vertexShader: `
          attribute vec3 smoothNormal;
          uniform float uOutlineWidth;
          varying vec3 vStoreClipPos;
          void main() {
            vec3 extruded = position + smoothNormal * uOutlineWidth;
            vStoreClipPos = extruded;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(extruded, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          varying vec3 vStoreClipPos;
          void main() {
            if (${storeClipCondition}) discard;
            gl_FragColor = vec4(uColor, 1.0);
          }
        `,
        side: THREE.BackSide,
        depthWrite: true
      });
      const fujiOutlineMesh = new THREE.Mesh(fujiOutlineGeom, fujiOutlineMat);
      fujiOutlineMesh.renderOrder = -1;
      fujiMesh.add(fujiOutlineMesh);
      fujiGroup.add(fujiMesh);
      registerBuildItem(2, fujiMesh, 'growY');

      // Foothills dark moss turf
      const turf = new THREE.Mesh(new THREE.BoxGeometry(11.8, 0.14, 8.6), makeToonMat(0x1b2c36));
      turf.position.set(-1.9, 0.04, -3.55);
      turf.receiveShadow = true;
      fujiGroup.add(turf);
      registerBuildItem(2, turf, 'rise', 0.4);

      // --- VOLCANIC CRATER MOLTEN MAGMA POOL & RADIATING LAVA FISSURES ---
      const craterGroup = new THREE.Group();
      const magmaTex = createMagmaTexture();
      volcanoFX.magmaPoolMat = new THREE.MeshStandardMaterial({
        map: magmaTex,
        emissiveMap: magmaTex,
        color: 0xff6b1a,
        emissive: 0xff5a12,
        emissiveIntensity: 2.1,
        roughness: 0.3
      });
      const magmaPool = new THREE.Mesh(new THREE.CircleGeometry(0.86, 24), volcanoFX.magmaPoolMat);
      magmaPool.rotation.x = -Math.PI / 2;
      magmaPool.position.set(FUJI_CENTER.x, FUJI_PEAK_H - 0.36, FUJI_CENTER.y);
      craterGroup.add(magmaPool);
      volcanoFX.magmaPoolMesh = magmaPool;
      registerBuildItem(2, magmaPool, 'pop');

      // 6 Glowing volcanic magma fissure cracks hugging the upper cone slopes
      const fissureAngles = [0.25, 1.15, 2.05, 3.1, 4.2, 5.35];
      fissureAngles.forEach((ang, idx) => {
        const pts = [];
        const steps = 8;
        const maxR = 1.65 + (idx % 2) * 0.55;
        for (let s = 0; s <= steps; s++) {
          const frac = s / steps;
          const r = 0.72 + frac * maxR;
          const jitterAng = ang + Math.sin(frac * 9.0 + idx) * 0.12;
          const wx = FUJI_CENTER.x + Math.cos(jitterAng) * r;
          const wz = FUJI_CENTER.y + Math.sin(jitterAng) * r;
          const wy = getFujiHeight(wx, wz) + 0.045;
          pts.push(new THREE.Vector3(wx, wy, wz));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tubeGeom = new THREE.TubeGeometry(curve, 16, 0.045 - (idx % 2) * 0.008, 6, false);
        const fMat = new THREE.MeshStandardMaterial({
          color: 0xff8022,
          emissive: 0xff4500,
          emissiveIntensity: 1.8,
          roughness: 0.25
        });
        const fMesh = new THREE.Mesh(tubeGeom, fMat);
        craterGroup.add(fMesh);
        volcanoFX.fissureMats.push(fMat);
        registerBuildItem(2, fMesh, 'pop');
      });

      fujiGroup.add(craterGroup);

      // Crater pulsing warm volcanic light
      const craterLight = new THREE.PointLight(0xff5a18, 3.8, 17.5, 1.3);
      craterLight.position.set(FUJI_CENTER.x, FUJI_PEAK_H + 0.85, FUJI_CENTER.y);
      fujiGroup.add(craterLight);
      sceneLights.crater = craterLight;

      // --- STAGE 4: Hiking Trail, Torii Gates, Lantern & Miniature Pine Trees ---
      const trailWaypoints = [
        [3.35, -1.0], [2.95, -1.65], [2.45, -2.15], [1.85, -2.25], [1.25, -2.60],
        [1.40, -3.15], [0.75, -3.35], [0.15, -3.30], [-0.35, -3.55], [-0.75, -3.78]
      ].map(([x, z]) => new THREE.Vector3(x, getFujiHeight(x, z) + 0.05, z));

      const trailCurve = new THREE.CatmullRomCurve3(trailWaypoints);
      const trailGroup = new THREE.Group();
      const baseStepGeom = createRoundedBox(0.54, 0.14, 0.25, 0.02);
      const baseStepMat = makeToonMat(0x3a4052);
      const treadGeom = createRoundedBox(0.46, 0.055, 0.20, 0.015);
      const treadMatA = makeToonMat(0x7c6a5e);
      const treadMatB = makeToonMat(0x6c5b50);
      const postGeom = new THREE.CylinderGeometry(0.022, 0.028, 0.28, 6);
      const postMat = makeToonMat(0x4a392e);
      const postCapMat = makeToonMat(0x282c3a);
      const railRopeMat = makeToonMat(0x9a7d62);
      const trailGlowMat = new THREE.MeshStandardMaterial({
        color: 0xffdfa8,
        emissive: 0xffaa44,
        emissiveIntensity: 1.4
      });
      registerManagedEmissive(trailGlowMat);

      const stepCount = 66;
      const spacedPts = trailCurve.getSpacedPoints(stepCount);
      const leftRailPts = [];
      const rightRailPts = [];

      for (let i = 0; i <= stepCount; i++) {
        const t = i / stepCount;
        const pt = spacedPts[i];
        const tangent = trailCurve.getTangentAt(t);
        const yaw = Math.atan2(tangent.x, tangent.z);
        const groundY = Math.max(0.09, getFujiHeight(pt.x, pt.z));

        const stepUnit = new THREE.Group();
        stepUnit.position.set(pt.x, groundY, pt.z);

        // Solid stone foundation riser embedded into the mountain slope (eliminates gaps)
        const riser = new THREE.Mesh(baseStepGeom, baseStepMat);
        riser.position.set(0, -0.015, 0);
        riser.rotation.order = 'YXZ';
        riser.rotation.y = yaw;
        riser.receiveShadow = true;
        riser.castShadow = true;
        stepUnit.add(riser);

        // Level weathered timber/stone tread slab on top
        const tread = new THREE.Mesh(treadGeom, i % 2 === 0 ? treadMatA : treadMatB);
        tread.position.set(0, 0.062, 0);
        tread.rotation.order = 'YXZ';
        tread.rotation.y = yaw;
        tread.receiveShadow = true;
        tread.castShadow = true;
        stepUnit.add(tread);

        // Paired left & right handrail posts + continuous side guide rails
        if (i % 5 === 0 || i === stepCount) {
          const right = new THREE.Vector3(tangent.z, 0, -tangent.x).normalize();
          for (const side of [-1, 1]) {
            const dx = right.x * 0.27 * side;
            const dz = right.z * 0.27 * side;
            const py = Math.max(0.10, getFujiHeight(pt.x + dx, pt.z + dz));
            const dy = py - groundY;
            const post = new THREE.Mesh(postGeom, postMat);
            post.position.set(dx, dy + 0.13, dz);
            post.castShadow = true;
            stepUnit.add(post);

            const isLanternPost = (i === 10 && side === 1) || (i === 25 && side === -1) || (i === 40 && side === 1) || (i === 55 && side === -1);
            const cap = new THREE.Mesh(
              isLanternPost ? new THREE.BoxGeometry(0.055, 0.055, 0.055) : new THREE.CylinderGeometry(0.028, 0.028, 0.03, 6),
              isLanternPost ? trailGlowMat : postCapMat
            );
            cap.position.set(dx, dy + 0.275, dz);
            stepUnit.add(cap);

            const railAnchor = new THREE.Vector3(pt.x + dx, py + 0.23, pt.z + dz);
            if (side < 0) leftRailPts.push(railAnchor);
            else rightRailPts.push(railAnchor);
          }
        }
        trailGroup.add(stepUnit);
        registerBuildItem(3, stepUnit, 'drop', 0.65);
      }

      if (leftRailPts.length >= 2) {
        const leftCurve = new THREE.CatmullRomCurve3(leftRailPts);
        const leftRailMesh = new THREE.Mesh(new THREE.TubeGeometry(leftCurve, 56, 0.013, 5, false), railRopeMat);
        trailGroup.add(leftRailMesh);
        registerBuildItem(3, leftRailMesh, 'pop');
      }
      if (rightRailPts.length >= 2) {
        const rightCurve = new THREE.CatmullRomCurve3(rightRailPts);
        const rightRailMesh = new THREE.Mesh(new THREE.TubeGeometry(rightCurve, 56, 0.013, 5, false), railRopeMat);
        trailGroup.add(rightRailMesh);
        registerBuildItem(3, rightRailMesh, 'pop');
      }

      fujiGroup.add(trailGroup);

      // Vermilion-Red Miniature Torii Gates (taller clearance above staircase treads)
      function createToriiGate(scale = 1.0) {
        const torii = new THREE.Group();
        const redMat = makeToonMat(0xd9302c);
        const darkCapMat = makeToonMat(0x1b1e2b);

        const pillarGeom = new THREE.CylinderGeometry(0.056, 0.070, 1.50, 10);
        [-0.38, 0.38].forEach((px) => {
          const p = new THREE.Mesh(pillarGeom, redMat);
          p.position.set(px, 0.72, 0);
          p.castShadow = true;
          addOutline(p, 0.02, 0x0b0e1c);
          torii.add(p);
          const base = new THREE.Mesh(new THREE.CylinderGeometry(0.088, 0.098, 0.18, 10), darkCapMat);
          base.position.set(px, 0.04, 0);
          torii.add(base);
        });

        const nuki = new THREE.Mesh(createRoundedBox(1.12, 0.09, 0.09, 0.015), redMat);
        nuki.position.set(0, 1.12, 0);
        nuki.castShadow = true;
        addOutline(nuki, 0.018, 0x0b0e1c);
        torii.add(nuki);

        const kasagi = new THREE.Mesh(createRoundedBox(1.34, 0.095, 0.125, 0.02), redMat);
        kasagi.position.set(0, 1.40, 0);
        kasagi.castShadow = true;
        addOutline(kasagi, 0.018, 0x0b0e1c);
        torii.add(kasagi);

        const topCap = new THREE.Mesh(createRoundedBox(1.40, 0.06, 0.14, 0.015), darkCapMat);
        topCap.position.set(0, 1.46, 0);
        torii.add(topCap);

        const tablet = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.22, 0.095), darkCapMat);
        tablet.position.set(0, 1.25, 0);
        torii.add(tablet);

        torii.scale.setScalar(scale);
        return torii;
      }

      const toriiConfigs = [
        { t: 0.04, scale: 1.18, yOff: 0.08 },
        { t: 0.29, scale: 0.96, yOff: 0.06 },
        { t: 0.56, scale: 0.85, yOff: 0.06 },
        { t: 0.81, scale: 0.76, yOff: 0.06 }
      ];
      toriiConfigs.forEach((cfg) => {
        const pt = trailCurve.getPointAt(cfg.t);
        const tangent = trailCurve.getTangentAt(cfg.t);
        const gate = createToriiGate(cfg.scale);
        gate.position.set(pt.x, Math.max(0.12, getFujiHeight(pt.x, pt.z) + cfg.yOff), pt.z);
        gate.rotation.y = Math.atan2(tangent.x, tangent.z);
        fujiGroup.add(gate);
        registerBuildItem(3, gate, 'drop', 1.4);
      });

      // Glowing Stone Lantern beside trailhead Torii
      const lanternGroup = new THREE.Group();
      const stoneMat = makeToonMat(0x6c7385);
      const lBase = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.14, 6), stoneMat);
      lBase.position.y = 0.07;
      const lPost = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.08, 0.34, 6), stoneMat);
      lPost.position.y = 0.28;
      const lGlowMat = new THREE.MeshStandardMaterial({
        color: 0xffd28a,
        emissive: 0xff9b3d,
        emissiveIntensity: 2.2,
        roughness: 0.3
      });
      registerManagedEmissive(lGlowMat);
      const lGlow = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), lGlowMat);
      lGlow.position.y = 0.52;
      const lRoof = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.16, 6), stoneMat);
      lRoof.position.y = 0.67;
      addOutline(lRoof, 0.018, 0x0b0e1c);
      lanternGroup.add(lBase, lPost, lGlow, lRoof);
      lanternGroup.position.set(3.05, 0.11, -0.45);
      fujiGroup.add(lanternGroup);
      registerBuildItem(3, lanternGroup, 'pop');

      const toriiGlowLight = new THREE.PointLight(0xff9b42, 1.5, 4.0, 1.7);
      toriiGlowLight.position.set(3.05, 0.72, -0.45);
      fujiGroup.add(toriiGlowLight);
      registerManagedLight(toriiGlowLight);

      // Stylized Tiered Cel-Shaded Pine Trees (registered sequentially so they pop up like a toy wave!)
      const pinePalette = [0x1c4545, 0x22544f, 0x1a3c47, 0x295d52];
      const trunkMat = makeToonMat(0x3d2e28);

      function createMiniaturePine(scale = 1.0, colorHex = 0x1f4b48) {
        const tree = new THREE.Group();
        const leafMat = makeToonMat(colorHex, { gradientMap: toonGrad3 });
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.34, 6), trunkMat);
        trunk.position.y = 0.17;
        tree.add(trunk);

        [
          { r: 0.36, h: 0.48, y: 0.46 },
          { r: 0.28, h: 0.44, y: 0.76 },
          { r: 0.19, h: 0.38, y: 1.04 }
        ].forEach((tier, idx) => {
          const cone = new THREE.Mesh(new THREE.ConeGeometry(tier.r, tier.h, 7), leafMat);
          cone.position.y = tier.y;
          cone.rotation.y = idx * 0.5;
          cone.castShadow = true;
          cone.receiveShadow = true;
          addOutline(cone, 0.022 / Math.max(0.6, scale), 0x090d18);
          tree.add(cone);
        });
        tree.scale.setScalar(scale);
        return tree;
      }

      const pineSpots = [
        [-6.9, -2.5, 1.05], [-6.4, -3.4, 1.15], [-5.8, -2.2, 0.88], [-7.1, -4.6, 0.95],
        [-6.3, -5.8, 1.10], [-5.2, -6.5, 0.92], [-4.8, -4.5, 0.85], [-5.5, -3.6, 0.78],
        [-6.6, -2.0, 0.82], [-4.2, -2.2, 0.75], [-3.6, -2.6, 0.72], [-4.5, -5.8, 0.88],
        [-3.2, -6.8, 0.96], [-1.8, -7.0, 0.88], [0.2, -6.9, 0.94], [1.8, -6.5, 1.02],
        [3.1, -5.9, 0.92], [4.1, -4.8, 0.95], [4.6, -3.5, 0.85], [3.5, -4.2, 0.82],
        [-3.9, -3.9, 0.64], [-3.1, -4.8, 0.58], [-2.2, -5.4, 0.54], [1.4, -5.2, 0.60],
        [2.5, -4.4, 0.62], [2.4, -3.3, 0.56], [-2.5, -2.15, 0.62], [-1.2, -2.15, 0.58],
        [3.6, -3.1, 0.88], [4.1, -2.2, 0.78], [2.8, -0.9, 0.72], [2.55, -1.45, 0.66],
        [4.8, -1.8, 0.84], [4.6, -6.1, 0.90], [-7.2, -6.6, 0.92], [0.4, -2.15, 0.54],
        [-4.9, -2.9, 0.70], [1.9, -3.7, 0.52], [-0.4, -5.6, 0.52]
      ];

      pineSpots.forEach(([px, pz, sc], idx) => {
        const py = getFujiHeight(px, pz);
        if (py < 3.6) {
          const tree = createMiniaturePine(sc, pinePalette[idx % pinePalette.length]);
          tree.position.set(px, Math.max(0.06, py - 0.08), pz);
          tree.rotation.y = seededRandom() * Math.PI * 2;
          fujiGroup.add(tree);
          registerBuildItem(3, tree, 'pop');
        }
      });

      dioramaRoot.add(fujiGroup);
    }

    // =========================================================================
    // 6. VOLCANO SPECIAL EFFECTS SYSTEM (SMOKE PUFFS, EMBERS & LAVA BOMBS)
    // =========================================================================
    function buildVolcanoFX() {
      const fxGroup = new THREE.Group();

      // 1) Stylized Cel-Shaded Billowing Smoke Puffs (Toon-shaded icosahedron clusters)
      const puffGeom = new THREE.IcosahedronGeometry(0.45, 1);
      const puffCount = 26;
      for (let i = 0; i < puffCount; i++) {
        const mat = new THREE.MeshToonMaterial({
          color: 0x3b3f54,
          emissive: 0xff5a18,
          emissiveIntensity: 0.45,
          gradientMap: toonGrad3,
          transparent: true,
          opacity: 0.85
        });
        const mesh = new THREE.Mesh(puffGeom, mat);
        mesh.position.copy(volcanoFX.craterPos);
        fxGroup.add(mesh);

        volcanoFX.smokePuffs.push({
          mesh,
          mat,
          age: (i / puffCount),
          speed: 0.22 + seededRandom() * 0.14,
          driftX: (seededRandom() - 0.35) * 1.4,
          driftZ: (seededRandom() - 0.5) * 1.1,
          spinX: (seededRandom() - 0.5) * 1.6,
          spinY: (seededRandom() - 0.5) * 1.6,
          baseScale: 0.55 + seededRandom() * 0.45
        });
      }

      // 2) Rising Glowing Volcanic Embers / Sparks
      const emberCount = 130;
      volcanoFX.emberPositions = new Float32Array(emberCount * 3);
      for (let i = 0; i < emberCount; i++) {
        const data = {
          age: seededRandom(),
          speed: 0.24 + seededRandom() * 0.35,
          angle: seededRandom() * Math.PI * 2,
          radius: 0.15 + seededRandom() * 0.65,
          spread: 0.9 + seededRandom() * 2.1,
          swirl: 1.5 + seededRandom() * 2.5
        };
        volcanoFX.emberData.push(data);
        volcanoFX.emberPositions[i * 3 + 0] = volcanoFX.craterPos.x;
        volcanoFX.emberPositions[i * 3 + 1] = volcanoFX.craterPos.y;
        volcanoFX.emberPositions[i * 3 + 2] = volcanoFX.craterPos.z;
      }
      const emberGeom = new THREE.BufferGeometry();
      emberGeom.setAttribute('position', new THREE.BufferAttribute(volcanoFX.emberPositions, 3));
      volcanoFX.emberMat = new THREE.PointsMaterial({
        map: createSoftSpriteTexture('rgba(255,245,170,1)', 'rgba(255,105,20,0.85)'),
        size: 0.32,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      volcanoFX.emberSystem = new THREE.Points(emberGeom, volcanoFX.emberMat);
      fxGroup.add(volcanoFX.emberSystem);

      // 3) Ballistic Glowing Lava Bombs (for Eruption mode)
      const bombGeom = new THREE.DodecahedronGeometry(0.14, 0);
      for (let i = 0; i < 18; i++) {
        const bMat = new THREE.MeshStandardMaterial({
          color: 0xffc857,
          emissive: 0xff4500,
          emissiveIntensity: 3.2,
          roughness: 0.2,
          transparent: true,
          opacity: 1
        });
        const bomb = new THREE.Mesh(bombGeom, bMat);
        bomb.visible = false;
        fxGroup.add(bomb);
        volcanoFX.lavaBombs.push({
          mesh: bomb,
          mat: bMat,
          age: i / 18,
          duration: 1.15 + seededRandom() * 0.75,
          vel: new THREE.Vector3(),
          startOffset: new THREE.Vector3()
        });
        resetLavaBomb(volcanoFX.lavaBombs[i]);
      }

      dioramaRoot.add(fxGroup);
    }

    function resetLavaBomb(bomb) {
      const ang = seededRandom() * Math.PI * 2;
      const horizSpeed = 1.85 + seededRandom() * 2.95;
      bomb.startOffset.set(Math.cos(ang) * 0.36, 0.0, Math.sin(ang) * 0.36);
      bomb.vel.set(
        Math.cos(ang) * horizSpeed,
        5.2 + seededRandom() * 4.2,
        Math.sin(ang) * horizSpeed
      );
      bomb.duration = 1.25 + seededRandom() * 0.75;
    }

    function updateVolcanoFX(dt, elapsed) {
      const fxMul = buildState.fxMultiplier;
      const isDormant = currentVolcano === 'dormant';
      const isActive = currentVolcano === 'active';
      const isErupting = currentVolcano === 'eruption';

      // Distinct intensity profiles: Dormant (cold/quiet) vs Active (smoldering smoke) vs Eruption (blazing outburst)
      const magmaTarget = isDormant ? 0.0 : isActive ? 1.55 : 5.4;
      const fissureTarget = isDormant ? 0.0 : isActive ? 1.05 : 4.8;
      const lightTarget = isDormant ? 0.0 : isActive ? 3.2 : 14.5;

      const pulse = isDormant
        ? 0
        : Math.sin(elapsed * (isErupting ? 8.5 : 2.8)) * (isErupting ? 0.55 : 0.18) +
          Math.cos(elapsed * 12.2) * (isErupting ? 0.25 : 0.06);

      if (volcanoFX.magmaPoolMat) {
        volcanoFX.magmaPoolMat.color.setHex(isDormant ? 0x1d1a24 : 0xff6b1a);
        volcanoFX.magmaPoolMat.emissiveIntensity = Math.max(0, (magmaTarget + pulse) * fxMul);
        volcanoFX.magmaPoolMesh.rotation.z = elapsed * (isDormant ? 0 : isErupting ? 0.58 : 0.12);
      }

      for (let i = 0; i < volcanoFX.fissureMats.length; i++) {
        const wave = isDormant ? 0 : Math.sin(elapsed * (isErupting ? 7.2 : 2.2) + i * 1.1) * (isErupting ? 0.65 : 0.2);
        volcanoFX.fissureMats[i].color.setHex(isDormant ? 0x20222e : 0xff8022);
        volcanoFX.fissureMats[i].emissiveIntensity = Math.max(0, (fissureTarget + wave) * fxMul);
      }

      if (sceneLights.crater) {
        const flicker = Math.sin(elapsed * 10.5) * 0.75 + Math.cos(elapsed * 18.3) * 0.45;
        sceneLights.crater.intensity = Math.max(
          0,
          (lightTarget + (isDormant ? 0 : flicker * (isErupting ? 3.8 : 0.45))) * fxMul
        );
        sceneLights.crater.color.setHex(isErupting ? 0xff3b08 : 0xff6b22);
      }

      // 1) Update Stylized Cel-Shaded Smoke Plumes
      const windX = currentWeather === 'storm' ? 1.45 : currentWeather === 'rain' ? 0.55 : 0.24;
      const activePuffLimit = isDormant ? 0 : isActive ? 14 : volcanoFX.smokePuffs.length;
      const heightBoost = isActive ? 4.8 : 8.2;
      const speedBoost = isActive ? 0.85 : 2.15;

      for (let i = 0; i < volcanoFX.smokePuffs.length; i++) {
        const p = volcanoFX.smokePuffs[i];
        p.age = (p.age + dt * p.speed * speedBoost) % 1.0;

        if (i >= activePuffLimit || fxMul < 0.05) {
          p.mesh.visible = false;
          continue;
        }
        p.mesh.visible = true;
        const t = p.age;
        const y = volcanoFX.craterPos.y + 0.18 + t * heightBoost;
        const sway = Math.sin(elapsed * (isErupting ? 2.4 : 1.2) + i) * (isErupting ? 0.34 : 0.20) * t;
        const x = volcanoFX.craterPos.x + (p.driftX * (isErupting ? 0.85 : 0.45) + windX) * t * t + sway;
        const z = volcanoFX.craterPos.z + p.driftZ * (isErupting ? 0.85 : 0.45) * t;
        p.mesh.position.set(x, y, z);

        const scaleGrow = p.baseScale * (isErupting ? (0.65 + t * 2.85) : (0.50 + t * 1.65));
        p.mesh.scale.set(scaleGrow * 1.08, scaleGrow * 0.92, scaleGrow);
        p.mesh.rotation.x += dt * p.spinX * (isErupting ? 1.8 : 0.9);
        p.mesh.rotation.y += dt * p.spinY * (isErupting ? 1.8 : 0.9);

        // Active: cool grey steamy plume with mild crater bounce; Eruption: dense dark ash lit fiercely from below
        const fade = Math.sin(Math.min(1, t * 1.08) * Math.PI);
        p.mat.opacity = fade * (isActive ? 0.66 : 0.92) * fxMul;
        const craterGlow = Math.max(0, 1.0 - t * (isErupting ? 1.65 : 2.6));
        p.mat.emissiveIntensity = craterGlow * (isActive ? 0.42 : 2.45) * fxMul;
        p.mat.color.setHex(isErupting ? 0x241c2b : 0x62708c);
      }

      // 2) Update Rising Embers & Sparks
      if (volcanoFX.emberSystem) {
        const showEmbers = !isDormant && fxMul > 0.05;
        volcanoFX.emberSystem.visible = showEmbers;
        if (showEmbers) {
          const eSpeed = isErupting ? 2.15 : 0.72;
          const eHeight = isErupting ? 9.2 : 3.6;
          volcanoFX.emberMat.opacity = (isErupting ? 1.0 : 0.55) * fxMul;
          volcanoFX.emberMat.size = isErupting ? 0.48 : 0.22;

          const count = volcanoFX.emberData.length;
          const activeCount = isErupting ? count : Math.floor(count * 0.28);
          for (let i = 0; i < count; i++) {
            const ed = volcanoFX.emberData[i];
            if (i >= activeCount) {
              volcanoFX.emberPositions[i * 3 + 1] = -99;
              continue;
            }
            ed.age = (ed.age + dt * ed.speed * eSpeed) % 1.0;
            const t = ed.age;
            const ang = ed.angle + t * ed.swirl;
            const r = ed.radius + t * ed.spread * (isErupting ? 1.75 : 0.75);
            volcanoFX.emberPositions[i * 3 + 0] = volcanoFX.craterPos.x + Math.cos(ang) * r + windX * t * 0.9;
            volcanoFX.emberPositions[i * 3 + 1] = volcanoFX.craterPos.y + 0.1 + t * eHeight;
            volcanoFX.emberPositions[i * 3 + 2] = volcanoFX.craterPos.z + Math.sin(ang) * r;
          }
          volcanoFX.emberSystem.geometry.attributes.position.needsUpdate = true;
        }
      }

      // 3) Update Ballistic Lava Bombs (Eruption Mode)
      const gravity = -9.6;
      for (let i = 0; i < volcanoFX.lavaBombs.length; i++) {
        const b = volcanoFX.lavaBombs[i];
        if (!isErupting || fxMul < 0.1) {
          b.mesh.visible = false;
          continue;
        }
        b.mesh.visible = true;
        b.age += dt / b.duration;
        if (b.age >= 1.0) {
          b.age = b.age % 1.0;
          resetLavaBomb(b);
        }
        const tSec = b.age * b.duration;
        b.mesh.position.set(
          volcanoFX.craterPos.x + b.startOffset.x + b.vel.x * tSec,
          volcanoFX.craterPos.y + 0.15 + b.vel.y * tSec + 0.5 * gravity * tSec * tSec,
          volcanoFX.craterPos.z + b.startOffset.z + b.vel.z * tSec
        );
        b.mesh.rotation.x += dt * 8.0;
        b.mesh.rotation.y += dt * 6.0;
        const fadeOut = b.age > 0.68 ? Math.max(0, 1 - (b.age - 0.68) / 0.32) : 1.0;
        const sc = (1.1 + (1 - b.age) * 0.8) * fadeOut;
        b.mesh.scale.setScalar(Math.max(0.01, sc));
        b.mat.opacity = fadeOut * fxMul;
        b.mat.emissiveIntensity = (3.4 + Math.sin(elapsed * 22 + i) * 0.8) * fxMul;
      }

      // 4) Volcanic Tremor in Eruption Mode
      if (isErupting && fxMul > 0.5) {
        const rumblePulse = Math.max(0, Math.sin(elapsed * 1.65) - 0.42) / 0.58;
        const amp = rumblePulse * 0.075;
        dioramaRoot.position.x = (Math.sin(elapsed * 43.0) * amp);
        dioramaRoot.position.y = (Math.cos(elapsed * 51.0) * amp * 0.7);
        dioramaRoot.position.z = (Math.sin(elapsed * 37.0) * amp);
      } else {
        dioramaRoot.position.lerp(new THREE.Vector3(0, 0, 0), Math.min(1, dt * 8));
      }
    }

      // Roadside Storm Drain Grates
      function createDrainGrate(x, z, rotY = 0) {
        const g = new THREE.Group();

          color: 0x4b556b,
          roughness: 0.35,

        g.position.set(x, 0.055, z);

        return g;

      const drainsGroup = new THREE.Group();

      function createOrganicPuddle(x, y, z, rx, rz, rot = 0) {
        const shape = new THREE.Shape();
        const pts = 18;
        for (let i = 0; i <= pts; i++) {
          const a = (i / pts) * Math.PI * 2;
          const wobble = 1.0 + Math.sin(a * 3.0 + x) * 0.16 + Math.cos(a * 2.0 - z) * 0.12;
          const px = Math.cos(a) * rx * wobble;
          const py = Math.sin(a) * rz * wobble;
          if (i === 0) shape.moveTo(px, py);
          else shape.lineTo(px, py);
        }
        const geom = new THREE.ShapeGeometry(shape);
        geom.rotateX(-Math.PI / 2);
        const mesh = new THREE.Mesh(geom, streetMaterials.puddle);
        mesh.position.set(x, y, z);
        mesh.rotation.y = rot;
        return mesh;

        [0.4, 0.246, 2.75, 0.72, 0.42, 0.1], [2.85, 0.246, 0.55, 0.55, 0.82, -0.1],
        [-6.3, 0.246, 1.2, 0.52, 0.85, 0.05]
      ].forEach((p) => {
        const pud = createOrganicPuddle(...p);

        registerBuildItem(1, pud, 'pop');
      });

      streetGroup.add(puddlesGroup);

      // Shimmering Neon Reflections on puddles (faded in during Stage 7)
      function createReflectionTexture(hexColor) {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
        const col = new THREE.Color(hexColor);
        const r = Math.round(col.r * 255), gr = Math.round(col.g * 255), b = Math.round(col.b * 255);
        g.addColorStop(0.0, `rgba(${r},${gr},${b},0.42)`);
        g.addColorStop(0.42, `rgba(${r},${gr},${b},0.18)`);
        g.addColorStop(1.0, `rgba(${r},${gr},${b},0.0)`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 128);
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      [
        { x: -1.6, y: 0.072, z: 4.95, sx: 4.8, sz: 2.3, color: 0xffb85c, baseOp: 0.22 },
        { x: 2.45, y: 0.073, z: 4.85, sx: 2.4, sz: 2.1, color: 0x3ce8ff, baseOp: 0.26 },
        { x: 5.3, y: 0.072, z: 4.5, sx: 2.6, sz: 2.0, color: 0xffc46b, baseOp: 0.16 },
        { x: 3.1, y: 0.252, z: -0.6, sx: 1.5, sz: 1.3, color: 0xff5a6e, baseOp: 0.24 },
        { x: 3.1, y: 0.252, z: 0.5, sx: 1.6, sz: 1.4, color: 0x45c8ff, baseOp: 0.26 },
        { x: 5.4, y: 0.072, z: 0.6, sx: 2.1, sz: 2.4, color: 0x45c8ff, baseOp: 0.18 },
        { x: -2.2, y: 0.252, z: 2.75, sx: 3.8, sz: 1.2, color: 0x42e098, baseOp: 0.18 },
        { x: -6.35, y: 0.252, z: 1.15, sx: 1.4, sz: 1.9, color: 0xffae52, baseOp: 0.22 }
      ].forEach((spec, idx) => {
        const mat = new THREE.MeshBasicMaterial({
          map: createReflectionTexture(spec.color),
          transparent: true,
          opacity: spec.baseOp,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(spec.sx, spec.sz), mat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.set(spec.x, spec.y, spec.z);
        streetGroup.add(plane);
        shimmerReflections.push({ mesh: plane, mat, baseOp: spec.baseOp, phase: idx * 1.37 });
      });

      // Raindrop Splash Ripples
      const rippleGeom = new THREE.RingGeometry(0.06, 0.095, 20);
      rippleGeom.rotateX(-Math.PI / 2);

      [
        [1.7, 0.078, 5.0], [2.2, 0.078, 5.4], [1.2, 0.078, 4.7],
        [-2.2, 0.078, 5.1], [-2.9, 0.078, 5.5], [-1.7, 0.078, 4.8],

      dioramaRoot.add(streetGroup);
    }

      // 5) Parked Japanese Mama-chari Bicycle (Mint)
      function createJapaneseBicycle(frameHex = 0x52c4b8) {
        const bike = new THREE.Group();
        const frameMat = makeToonMat(frameHex);
        const tireMat = makeToonMat(0x1c202c);
        const chromeMat = makeToonMat(0xd5deeb);
        const leatherMat = makeToonMat(0x6e442c);

        function makeWheel(wx) {
          const wg = new THREE.Group();
          wg.add(new THREE.Mesh(new THREE.TorusGeometry(0.29, 0.036, 8, 20), tireMat));
          wg.add(new THREE.Mesh(new THREE.TorusGeometry(0.255, 0.012, 6, 18), chromeMat));
          for (let s = 0; s < 4; s++) {
            const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.50, 4), chromeMat);
            sp.rotation.z = (s * Math.PI) / 4;
            wg.add(sp);
          }
          const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.08, 8), chromeMat);
          hub.rotation.x = Math.PI / 2;
          wg.add(hub);
          wg.position.set(wx, 0.32, 0);
          return wg;
        }
        bike.add(makeWheel(-0.50), makeWheel(0.50));

        function addTube(p1, p2, rad, mat) {
          const v1 = new THREE.Vector3(...p1), v2 = new THREE.Vector3(...p2);
          const dir = v2.clone().sub(v1);
          const cyl = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, dir.length(), 8), mat);
          cyl.position.copy(v1).addScaledVector(dir, 0.5);
          cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
          cyl.castShadow = true;
          bike.add(cyl);
        }
        addTube([-0.50, 0.32, 0], [-0.08, 0.34, 0], 0.022, frameMat);
        addTube([-0.50, 0.32, 0], [-0.16, 0.72, 0], 0.020, frameMat);
        addTube([-0.08, 0.34, 0], [-0.20, 0.80, 0], 0.024, frameMat);
        addTube([-0.08, 0.34, 0], [0.38, 0.74, 0], 0.024, frameMat);
        addTube([0.50, 0.32, 0], [0.34, 0.94, 0], 0.022, frameMat);
        addTube([0.34, 0.94, -0.26], [0.34, 0.94, 0.26], 0.018, chromeMat);
        addTube([0.34, 0.94, -0.26], [0.24, 0.94, -0.28], 0.022, leatherMat);
        addTube([0.34, 0.94, 0.26], [0.24, 0.94, 0.28], 0.022, leatherMat);

        const saddle = new THREE.Mesh(createRoundedBox(0.24, 0.07, 0.16, 0.025), leatherMat);
        saddle.position.set(-0.22, 0.84, 0);
        const basket = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.22, 0.30), makeToonMat(0x3a4256));
        basket.position.set(0.54, 0.78, 0);

        const rack = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.03, 0.16), chromeMat);

        addTube([-0.46, 0.30, 0.04], [-0.52, 0.02, 0.20], 0.012, chromeMat);
        bike.rotation.x = 0.09;
        return bike;
      }

    // =========================================================================
    // 10. WEATHER PARTICLE SYSTEMS (RAIN, STORM, SNOW, STARRY CLEAR NIGHT)
    // =========================================================================
    function buildWeatherSystems() {
      // 1) Rain Streaks — GPU-friendly InstancedMesh for smooth rain without CPU bottleneck
      const dropCount = 400;
      rainVelocities = new Float32Array(dropCount);
      const rainDummy = new THREE.Object3D();
      const rainStripGeom = new THREE.PlaneGeometry(0.012, 0.28);
      rainMat = new THREE.MeshBasicMaterial({
        color: 0xbce0ff,
        transparent: true,
        opacity: 0.18,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      rainSystem = new THREE.InstancedMesh(rainStripGeom, rainMat, dropCount);
      rainSystem.frustumCulled = false;

      // Store per-drop data in a separate array for fast GPU updates
      rainPositions = new Float32Array(dropCount * 3);
      for (let i = 0; i < dropCount; i++) {
        rainPositions[i * 3 + 0] = (seededRandom() - 0.5) * 16.8;
        rainPositions[i * 3 + 1] = seededRandom() * 12.2;
        rainPositions[i * 3 + 2] = (seededRandom() - 0.5) * 16.8;
        rainVelocities[i] = 11.5 + seededRandom() * 5.5;
        rainDummy.position.set(rainPositions[i * 3], rainPositions[i * 3 + 1], rainPositions[i * 3 + 2]);
        rainDummy.updateMatrix();
        rainSystem.setMatrixAt(i, rainDummy.matrix);
      }
      rainSystem.instanceMatrix.needsUpdate = true;
      dioramaRoot.add(rainSystem);

      // 2) Gentle Swirling Snowflakes (Snowy Night)
      const snowCount = 520;
      snowPositions = new Float32Array(snowCount * 3);
      snowPhases = new Float32Array(snowCount);
      for (let i = 0; i < snowCount; i++) {
        snowPositions[i * 3 + 0] = (seededRandom() - 0.5) * 16.6;
        snowPositions[i * 3 + 1] = seededRandom() * 12.0;
        snowPositions[i * 3 + 2] = (seededRandom() - 0.5) * 16.6;
        snowPhases[i] = seededRandom() * Math.PI * 2;
      }
      const snowGeom = new THREE.BufferGeometry();
      snowGeom.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));
      snowMat = new THREE.PointsMaterial({
        map: createSoftSpriteTexture('rgba(255,255,255,1)', 'rgba(215,236,255,0.75)'),
        size: 0.22,
        transparent: true,
        opacity: 0,
        depthWrite: false
      });
      snowSystem = new THREE.Points(snowGeom, snowMat);
      snowSystem.visible = false;
      dioramaRoot.add(snowSystem);

      // 3) Twinkling Miniature Stars & Floating Golden Fireflies (Clear Starry Night)
      const starCount = 280;
      const starPos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const theta = seededRandom() * Math.PI * 2;
        const phi = seededRandom() * Math.PI * 0.48;
        const rad = 26 + seededRandom() * 24;
        starPos[i * 3 + 0] = rad * Math.sin(phi) * Math.cos(theta);
        starPos[i * 3 + 1] = Math.abs(rad * Math.cos(phi)) + 3.0;
        starPos[i * 3 + 2] = rad * Math.sin(phi) * Math.sin(theta);
      }
      const starGeom = new THREE.BufferGeometry();
      starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      starMat = new THREE.PointsMaterial({
        map: createSoftSpriteTexture('rgba(255,255,255,1)', 'rgba(180,215,255,0.6)'),
        size: 0.42,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      starSystem = new THREE.Points(starGeom, starMat);
      starSystem.visible = false;
      scene.add(starSystem);

      const ffCount = 46;
      const ffPos = new Float32Array(ffCount * 3);
      fireflyBase = [];
      for (let i = 0; i < ffCount; i++) {
        const bx = (seededRandom() - 0.5) * 12.5;
        const by = 0.8 + seededRandom() * 3.8;
        const bz = -6.2 + seededRandom() * 7.5;
        fireflyBase.push({ x: bx, y: by, z: bz, p: seededRandom() * Math.PI * 2, s: 0.6 + seededRandom() * 0.8 });
        ffPos[i * 3 + 0] = bx;
        ffPos[i * 3 + 1] = by;
        ffPos[i * 3 + 2] = bz;
      }
      const ffGeom = new THREE.BufferGeometry();
      ffGeom.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
      fireflyMat = new THREE.PointsMaterial({
        map: createSoftSpriteTexture('rgba(255,250,180,1)', 'rgba(190,255,110,0.65)'),
        size: 0.24,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      fireflySystem = new THREE.Points(ffGeom, fireflyMat);
      fireflySystem.visible = false;
      dioramaRoot.add(fireflySystem);

      // 4) 3D Sky Lightning Bolts & Thunderhead Flash Sprites (Thunderstorm mode)
      const boltConfigs = [
        { x: -8.6, yTop: 15.8, yBot: 6.4, z: -7.2, skewX: 1.4, branches: 2 },
        { x: 6.8,  yTop: 16.2, yBot: 6.0, z: -6.8, skewX: -1.6, branches: 3 },
        { x: -1.8, yTop: 16.8, yBot: 8.2, z: -9.8, skewX: 0.9, branches: 2 },
        { x: 3.4,  yTop: 16.4, yBot: 7.4, z: -9.2, skewX: -1.1, branches: 2 }
      ];

      function buildJaggedBranch(pts, radius, coreMat, haloMat, group) {
        const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.05);
        const core = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length * 3, radius, 5, false), coreMat);
        const halo = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length * 3, radius * 2.8, 5, false), haloMat);
        group.add(core, halo);
      }

      boltConfigs.forEach((cfg, idx) => {
        const boltGroup = new THREE.Group();
        const coreMat = new THREE.MeshBasicMaterial({
          color: 0xf4fbff,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const haloMat = new THREE.MeshBasicMaterial({
          color: 0x70c4ff,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const segs = 9;
        const mainPts = [];
        for (let s = 0; s <= segs; s++) {
          const t = s / segs;
          const jag = s === 0 || s === segs ? 0 : (seededRandom() - 0.5) * 1.45;
          const jagZ = s === 0 || s === segs ? 0 : (seededRandom() - 0.5) * 0.75;
          mainPts.push(new THREE.Vector3(
            cfg.x + t * cfg.skewX + jag,
            THREE.MathUtils.lerp(cfg.yTop, cfg.yBot, t),
            cfg.z + jagZ
          ));
        }
        buildJaggedBranch(mainPts, 0.065, coreMat, haloMat, boltGroup);

        // Forked secondary lightning branches
        for (let b = 0; b < cfg.branches; b++) {
          const startIdx = 2 + Math.floor((b * 2.2) % 5);
          const origin = mainPts[startIdx].clone();
          const dirSign = b % 2 === 0 ? 1 : -1;
          const bPts = [origin];
          for (let k = 1; k <= 4; k++) {
            const bt = k / 4;
            bPts.push(new THREE.Vector3(
              origin.x + dirSign * (0.65 + bt * 1.55) + (seededRandom() - 0.5) * 0.45,
              origin.y - bt * (2.2 + seededRandom() * 1.1),
              origin.z + (seededRandom() - 0.5) * 0.4
            ));
          }
          buildJaggedBranch(bPts, 0.034, coreMat, haloMat, boltGroup);
        }

        // Upper storm cloud flash glow sprite at bolt origin
        const cloudGlowMat = new THREE.SpriteMaterial({
          map: createSoftSpriteTexture('rgba(220,242,255,0.95)', 'rgba(110,175,255,0.45)'),
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const cloudGlow = new THREE.Sprite(cloudGlowMat);
        cloudGlow.position.set(cfg.x, cfg.yTop - 0.4, cfg.z);
        cloudGlow.scale.set(9.5, 4.2, 1);
        boltGroup.add(cloudGlow);

        boltGroup.visible = false;
        scene.add(boltGroup);
        lightningBolts.push({ group: boltGroup, coreMat, haloMat, cloudGlowMat, idx });
      });
    }

    // Realistic multi-flash lightning strike pattern
    let lightningMultiFlashTimer = 0;
    let lightningMultiFlashCount = 0;
    let lightningMultiFlashMax = 0;

    function triggerLightningStrike() {
      lightningFlash = 1.0;
      if (lightningBolts.length > 1) {
        activeLightningBolt = (activeLightningBolt + 1 + Math.floor(seededRandom() * (lightningBolts.length - 1))) % lightningBolts.length;
      }
      // Initiate realistic multi-flash burst (2-4 rapid re-flashes)
      lightningMultiFlashCount = 0;
      lightningMultiFlashMax = 2 + Math.floor(seededRandom() * 3);
      lightningMultiFlashTimer = 0.06 + seededRandom() * 0.08;
    }

    function updateAtmosphereTargets() {
      // Base sky & light colors by weather (balanced snow-night levels to avoid overexposing the cream store walls)
      const weatherPresets = {
        rain:  { inner: '#18233e', mid: '#0f1629', outer: '#060811', hemi: 0x5b7ec4, hemiI: 0.82, moon: 0x9fc2ff, moonI: 1.45, rimI: 0.68, exposure: 1.04, bloomThresh: 0.88, roadR: 0.52, puddleOp: 0.70 },
        storm: { inner: '#141a2e', mid: '#0b0f1e', outer: '#04060c', hemi: 0x455b8a, hemiI: 0.72, moon: 0x7c9ed4, moonI: 1.02, rimI: 0.55, exposure: 1.02, bloomThresh: 0.88, roadR: 0.44, puddleOp: 0.78 },
        snow:  { inner: '#1c2a46', mid: '#121b30', outer: '#080d1a', hemi: 0x6b8bc2, hemiI: 0.56, moon: 0xb0ccf2, moonI: 1.02, rimI: 0.42, exposure: 0.90, bloomThresh: 0.95, roadR: 0.68, puddleOp: 0.40 },
        clear: { inner: '#131d3b', mid: '#0b1126', outer: '#050712', hemi: 0x6280c7, hemiI: 0.80, moon: 0xb5ceff, moonI: 1.55, rimI: 0.66, exposure: 1.04, bloomThresh: 0.88, roadR: 0.74, puddleOp: 0.32 }
      };
      const wp = weatherPresets[currentWeather];

      skyColorsTarget.inner.set(wp.inner);
      skyColorsTarget.mid.set(wp.mid);
      skyColorsTarget.outer.set(wp.outer);

      // Fiery warm volcanic sky shift when Eruption mode is active!
      if (currentVolcano === 'eruption') {
        skyColorsTarget.inner.lerp(new THREE.Color('#5e1915'), 0.72);
        skyColorsTarget.mid.lerp(new THREE.Color('#2c0e14'), 0.56);
      } else if (currentVolcano === 'active') {
        skyColorsTarget.inner.lerp(new THREE.Color('#221c2a'), 0.14);
      }

      if (sceneLights.hemi) {
        sceneLights.hemi.color.setHex(wp.hemi);
        sceneLights.hemi.userData.targetIntensity = wp.hemiI;
      }
      if (sceneLights.moon) {
        sceneLights.moon.color.setHex(wp.moon);
        sceneLights.moon.userData.targetIntensity = wp.moonI;
      }
      if (sceneLights.rim) {
        sceneLights.rim.userData.targetIntensity = wp.rimI;
      }
      targetExposure = wp.exposure;
      targetBloomThreshold = wp.bloomThresh;
      if (streetMaterials.road) streetMaterials.road.userData.targetRoughness = wp.roadR;
      if (streetMaterials.puddle) streetMaterials.puddle.userData.targetOpacity = wp.puddleOp;
    }

    function updateWeatherAndLighting(dt, elapsed) {
      const fxMul = buildState.fxMultiplier;
      const isRain = currentWeather === 'rain';
      const isStorm = currentWeather === 'storm';
      const isSnow = currentWeather === 'snow';
      const isClear = currentWeather === 'clear';

      // Smooth sky color transition
      skyColorsCurrent.inner.lerp(skyColorsTarget.inner, Math.min(1, dt * 2.5));
      skyColorsCurrent.mid.lerp(skyColorsTarget.mid, Math.min(1, dt * 2.5));
      skyColorsCurrent.outer.lerp(skyColorsTarget.outer, Math.min(1, dt * 2.5));

      // Lightning logic in Thunderstorm mode (sky thunderbolts + dramatic flashes)
      if (isStorm && fxMul > 0.4) {
        lightningTimer -= dt;
        if (lightningTimer <= 0) {
          triggerLightningStrike();
          lightningTimer = 1.2 + seededRandom() * 2.0;
        }
      }
      // Multi-flash re-strike system for realistic thunderstorm feel
      if (lightningMultiFlashCount < lightningMultiFlashMax && lightningFlash < 0.15) {
        lightningMultiFlashTimer -= dt;
        if (lightningMultiFlashTimer <= 0) {
          lightningFlash = 0.4 + seededRandom() * 0.5; // diminishing re-flashes
          lightningMultiFlashCount++;
          lightningMultiFlashTimer = 0.04 + seededRandom() * 0.12;
        }
      }
      if (lightningFlash > 0) {
        // Non-linear fast decay with stutter for realism
        const decayRate = lightningFlash > 0.5 ? 4.5 : 2.2;
        lightningFlash = Math.max(0, lightningFlash - dt * decayRate);
      }
      // Realistic rapid flicker instead of smooth sine — sharp on/off strobe
      const flickerLightning = lightningFlash > 0
        ? lightningFlash * (Math.random() > 0.3 ? 1.0 : 0.15) * (0.7 + 0.3 * Math.sin(elapsed * 120))
        : 0;
      if (sceneLights.lightning) {
        sceneLights.lightning.intensity = flickerLightning * 12.5;
      }
      redrawBackdrop(flickerLightning);

      // Update visible 3D sky lightning bolts — sharp strobe pulses
      for (let i = 0; i < lightningBolts.length; i++) {
        const bolt = lightningBolts[i];
        const showBolt = isStorm && fxMul > 0.2 && lightningFlash > 0.02 && i === activeLightningBolt;
        bolt.group.visible = showBolt;
        if (showBolt) {
          // Sharp on/off strobe: bolt appears at near-full brightness then vanishes
          const sharpPulse = lightningFlash > 0.2 ? Math.pow(lightningFlash, 0.35) : lightningFlash * 2.0;
          const strobeFlicker = Math.random() > 0.25 ? 1.0 : 0.3;
          bolt.coreMat.opacity = Math.min(1, sharpPulse * strobeFlicker * 1.3);
          bolt.haloMat.opacity = Math.min(0.9, sharpPulse * strobeFlicker * 0.85);
          bolt.cloudGlowMat.opacity = Math.min(0.8, sharpPulse * 0.75);
        }
      }

      // Smooth road wetness, ambient/moonlight & exposure adjustment
      if (sceneLights.hemi && sceneLights.hemi.userData.targetIntensity !== undefined) {
        sceneLights.hemi.intensity = THREE.MathUtils.lerp(sceneLights.hemi.intensity, sceneLights.hemi.userData.targetIntensity, dt * 3);
      }
      if (sceneLights.moon && sceneLights.moon.userData.targetIntensity !== undefined) {
        sceneLights.moon.intensity = THREE.MathUtils.lerp(sceneLights.moon.intensity, sceneLights.moon.userData.targetIntensity, dt * 3);
      }
      if (sceneLights.rim && sceneLights.rim.userData.targetIntensity !== undefined) {
        sceneLights.rim.intensity = THREE.MathUtils.lerp(sceneLights.rim.intensity, sceneLights.rim.userData.targetIntensity, dt * 3);
      }
      if (renderer) {
        renderer.toneMappingExposure = THREE.MathUtils.lerp(renderer.toneMappingExposure, targetExposure, dt * 3);
      }
      if (bloomPass) {
        bloomPass.threshold = THREE.MathUtils.lerp(bloomPass.threshold, targetBloomThreshold, dt * 3);
      }
      if (streetMaterials.road && streetMaterials.road.userData.targetRoughness !== undefined) {
        streetMaterials.road.roughness = THREE.MathUtils.lerp(streetMaterials.road.roughness, streetMaterials.road.userData.targetRoughness, dt * 2.5);
      }
      if (streetMaterials.puddle && streetMaterials.puddle.userData.targetOpacity !== undefined) {
        streetMaterials.puddle.opacity = THREE.MathUtils.lerp(streetMaterials.puddle.opacity, streetMaterials.puddle.userData.targetOpacity, dt * 2.5);
      }

      // 1) Smooth Rain Streaks via InstancedMesh (Rain & Storm)
      if (rainSystem) {
        const showRain = (isRain || isStorm) && fxMul > 0.05;
        rainSystem.visible = showRain;
        if (showRain) {
          const stormMul = isStorm ? 1.4 : 1.0;
          rainMat.opacity = (isStorm ? 0.26 : 0.18) * fxMul;
          const slantX = isStorm ? 0.06 : 0.03;
          const _rainDummy = new THREE.Object3D();

          for (let i = 0; i < rainVelocities.length; i++) {
            const idx = i * 3;
            const spd = rainVelocities[i] * stormMul;
            rainPositions[idx + 0] += slantX * spd * dt;
            rainPositions[idx + 1] -= spd * dt;
            rainPositions[idx + 2] -= spd * 0.04 * dt;

            if (rainPositions[idx + 1] < 0.05) {
              rainPositions[idx + 0] = (seededRandom() - 0.5) * 16.8;
              rainPositions[idx + 1] = 10.6 + seededRandom() * 2.0;
              rainPositions[idx + 2] = (seededRandom() - 0.5) * 16.8;
            }

            _rainDummy.position.set(rainPositions[idx], rainPositions[idx + 1], rainPositions[idx + 2]);
            _rainDummy.updateMatrix();
            rainSystem.setMatrixAt(i, _rainDummy.matrix);
          }
          rainSystem.instanceMatrix.needsUpdate = true;
        }
      }

      // 2) Snowflakes
      if (snowSystem) {
        const showSnow = isSnow && fxMul > 0.05;
        snowSystem.visible = showSnow;
        if (showSnow) {
          snowMat.opacity = THREE.MathUtils.lerp(snowMat.opacity, 0.88 * fxMul, dt * 4);
          for (let i = 0; i < snowPhases.length; i++) {
            const ph = snowPhases[i];
            snowPositions[i * 3 + 0] += Math.sin(elapsed * 1.2 + ph) * 0.55 * dt;
            snowPositions[i * 3 + 1] -= (1.15 + (i % 4) * 0.24) * dt;
            snowPositions[i * 3 + 2] += Math.cos(elapsed * 0.9 + ph) * 0.45 * dt;
            if (snowPositions[i * 3 + 1] < 0.08) {
              snowPositions[i * 3 + 0] = (seededRandom() - 0.5) * 16.6;
              snowPositions[i * 3 + 1] = 11.2 + seededRandom() * 1.4;
              snowPositions[i * 3 + 2] = (seededRandom() - 0.5) * 16.6;
            }
          }
          snowSystem.geometry.attributes.position.needsUpdate = true;
        } else {
          snowMat.opacity = 0;
        }
      }

      // 3) Clear Night Stars & Fireflies
      if (starSystem && fireflySystem) {
        const showClear = isClear && fxMul > 0.05;
        starSystem.visible = showClear;
        fireflySystem.visible = showClear;
        if (showClear) {
          starMat.opacity = (0.72 + Math.sin(elapsed * 2.2) * 0.16) * fxMul;
          starSystem.rotation.y = elapsed * 0.015;
          fireflyMat.opacity = (0.75 + Math.sin(elapsed * 3.8) * 0.2) * fxMul;

          const ffAttr = fireflySystem.geometry.attributes.position;
          for (let i = 0; i < fireflyBase.length; i++) {
            const fb = fireflyBase[i];
            ffAttr.setXYZ(
              i,
              fb.x + Math.sin(elapsed * fb.s + fb.p) * 0.65,
              fb.y + Math.cos(elapsed * fb.s * 1.3 + fb.p) * 0.38,
              fb.z + Math.cos(elapsed * fb.s * 0.8 + fb.p) * 0.55
            );
          }
          ffAttr.needsUpdate = true;
        }
      }

      // 4) Puddle Ripples (active in Rain only, calm in Storm / Snow / Clear)
      const rippleActive = isRain && fxMul > 0.05;
      const rippleSpeedMul = 1.0;
      for (let i = 0; i < animatedRipples.length; i++) {
        const r = animatedRipples[i];
        r.mesh.visible = rippleActive;
        if (!rippleActive) continue;
        r.progress = (r.progress + dt * r.speed * rippleSpeedMul) % 1.0;
        const s = 0.25 + r.progress * r.maxScale;
        r.mesh.scale.set(s, 1, s);
        r.mat.opacity = Math.sin(r.progress * Math.PI) * 0.45 * (1.0 - r.progress * 0.5) * fxMul;
      }

      // 5) Wet Neon Reflections & Streetlamp Cone
      const wetRefMul = (isRain || isStorm ? 1.0 : isSnow ? 0.52 : 0.42) * fxMul;
      for (let i = 0; i < shimmerReflections.length; i++) {
        const sr = shimmerReflections[i];
        const wave = Math.sin(elapsed * 2.8 + sr.phase) * 0.08 + Math.cos(elapsed * 5.1 + sr.phase) * 0.04;
        if (sr.isCone) {
          sr.shaderMat.uniforms.uOpacity.value = sr.baseOp * (isClear ? 0.45 : 1.0) * fxMul;
        } else {
          sr.mat.opacity = Math.max(0, (sr.baseOp + wave * sr.baseOp * 2.1) * wetRefMul);
          sr.mesh.scale.x = 1.0 + wave * 0.25;
        }
      }
    }

    // =========================================================================
    // 11. LIGHTING RIG
    // =========================================================================
    function setupLighting() {
      sceneLights.hemi = new THREE.HemisphereLight(0x5b7ec4, 0x1b1e33, 0.88);
      scene.add(sceneLights.hemi);

      const moonLight = new THREE.DirectionalLight(0x9fc2ff, 1.50);
      moonLight.position.set(11, 18, 10);
      moonLight.castShadow = true;
      moonLight.shadow.mapSize.set(2048, 2048);
      moonLight.shadow.camera.near = 2;
      moonLight.shadow.camera.far = 45;
      const d = 13.5;
      moonLight.shadow.camera.left = -d;
      moonLight.shadow.camera.right = d;
      moonLight.shadow.camera.top = d;
      moonLight.shadow.camera.bottom = -d;
      moonLight.shadow.bias = -0.0006;
      moonLight.shadow.normalBias = 0.03;
      scene.add(moonLight);
      sceneLights.moon = moonLight;

      sceneLights.rim = new THREE.DirectionalLight(0x6d9bff, 0.72);
      sceneLights.rim.position.set(-12, 11, -14);
