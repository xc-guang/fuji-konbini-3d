      // Thunderstorm dramatic flash directional light
      sceneLights.lightning = new THREE.DirectionalLight(0xd9ecff, 0);
      sceneLights.lightning.position.set(-8, 20, 6);
      scene.add(sceneLights.lightning);
    }

    // =========================================================================
    // 12. CAMERA VIEWPOINTS & RESPONSIVE FRAMING
    // =========================================================================
    function getBaseOverviewDistance() {
      const aspect = window.innerWidth / window.innerHeight;
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const boundingRadius = 11.4;
      const vDist = boundingRadius / Math.sin(fovRad / 2);
      const hFovRad = 2 * Math.atan(Math.tan(fovRad / 2) * aspect);
      const hDist = boundingRadius / Math.sin(Math.min(fovRad, hFovRad) / 2);
      return Math.max(vDist, hDist) * 1.18;
    }

    function getViewPreset(name) {
      const dist = getBaseOverviewDistance();
      const scaleFactor = Math.max(0.88, Math.min(1.38, dist / 38));

      switch (name) {
        case 'konbini':
          return {
            target: new THREE.Vector3(-1.3, 1.45, 0.85),
            pos: new THREE.Vector3(2.8, 3.6, 11.2).multiplyScalar(scaleFactor * 0.92).add(new THREE.Vector3(-1.3, 0, 0.85))
          };
        case 'volcano':
          return {
            target: new THREE.Vector3(-0.75, 5.2, -3.2),
            pos: new THREE.Vector3(8.5, 6.2, 9.8).multiplyScalar(scaleFactor * 0.95).add(new THREE.Vector3(-0.75, 4.0, -3.2))
          };
        case 'alley':
          return {
            target: new THREE.Vector3(-2.4, 1.65, 1.4),
            pos: new THREE.Vector3(-10.2, 5.8, 10.6).multiplyScalar(scaleFactor * 0.92).add(new THREE.Vector3(-2.4, 0, 1.4))
          };
        case 'street':
          return {
            target: new THREE.Vector3(-0.9, 2.75, -0.5),
            pos: new THREE.Vector3(9.8, 3.1, 13.8).multiplyScalar(scaleFactor * 0.92)
          };
        case 'overview':
        default: {
          const dir = new THREE.Vector3(0.62, 0.56, 0.72).normalize();
          const target = new THREE.Vector3(-0.15, 1.55, -0.15);
          return {
            target,
            pos: target.clone().addScaledVector(dir, dist)
          };
        }
      }
    }

    function transitionToView(name, instant = false) {
      const preset = getViewPreset(name);
      if (instant) {
        camAnim.active = false;
        controls.target.copy(preset.target);
        camera.position.copy(preset.pos);
        controls.enableDamping = true;
        controls.update();
        return;
      }
      camAnim.startTarget.copy(controls.target);
      camAnim.endTarget.copy(preset.target);

      const startOffset = camera.position.clone().sub(controls.target);
      const endOffset = preset.pos.clone().sub(preset.target);
      camAnim.startSph.setFromVector3(startOffset);
      camAnim.endSph.setFromVector3(endOffset);
      let dTheta = camAnim.endSph.theta - camAnim.startSph.theta;
      while (dTheta > Math.PI) dTheta -= Math.PI * 2;
      while (dTheta < -Math.PI) dTheta += Math.PI * 2;
      camAnim.dTheta = dTheta;

      camAnim.elapsed = 0;
      camAnim.active = true;
      controls.enableDamping = false;
    }

    function updateResponsiveCamera(isInitial = false) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      if (composer) composer.setSize(w, h);

      const baseDist = getBaseOverviewDistance();
      controls.minDistance = Math.min(8.5, baseDist * 0.30);
      controls.maxDistance = baseDist * 1.75;

      if (isInitial) {
        transitionToView('overview', true);
      }
    }

    // =========================================================================
    // 13. 7-STAGE MODELING / BUILD-UP PLAYBACK ENGINE
    // =========================================================================
    function applyBuildStageProgress(stageIdx, stageT) {
      const items = buildStages[stageIdx];
      const count = items.length;
      if (count === 0) return;

      for (let i = 0; i < count; i++) {
        const item = items[i];
        // Slight wave stagger across items inside the same stage
        const staggerSpan = count > 1 ? 0.58 : 0.0;
        const itemStart = count > 1 ? (i / (count - 1)) * staggerSpan : 0;
        const itemDur = 1.0 - staggerSpan;
        const localT = THREE.MathUtils.clamp((stageT - itemStart) / Math.max(0.08, itemDur), 0, 1);

        if (localT <= 0.0001) {
          item.obj.visible = false;
          continue;
        }
        item.obj.visible = true;

        if (item.popMode === 'rise') {
          const e = easeOutCubic(localT);
          const s = easeOutBack(localT);
          item.obj.position.set(
            item.targetPos.x,
            item.targetPos.y - item.dropHeight * (1 - e),
            item.targetPos.z
          );
          item.obj.scale.copy(item.targetScale).multiplyScalar(Math.max(0.001, s));
        } else if (item.popMode === 'drop') {
          const e = easeOutCubic(localT);
          const b = easeOutBack(Math.min(1, localT * 1.08));
          item.obj.position.set(
            item.targetPos.x,
            item.targetPos.y + item.dropHeight * (1 - e),
            item.targetPos.z
          );
          item.obj.scale.set(
            item.targetScale.x * Math.max(0.001, b),
            item.targetScale.y * Math.max(0.001, b),
            item.targetScale.z * Math.max(0.001, b)
          );
        } else if (item.popMode === 'growY') {
          const e = easeOutBack(localT);
          item.obj.position.copy(item.targetPos);
          item.obj.scale.set(
            item.targetScale.x * Math.max(0.001, easeOutCubic(localT)),
            item.targetScale.y * Math.max(0.001, e),
            item.targetScale.z * Math.max(0.001, easeOutCubic(localT))
          );
        } else {
          // 'pop' bouncy clay scale-in
          const s = easeOutBack(localT);
          item.obj.position.copy(item.targetPos);
          item.obj.scale.copy(item.targetScale).multiplyScalar(Math.max(0.001, s));
        }
      }
    }

    function applyLightAndFxStage(stageT) {
      const e = easeOutCubic(THREE.MathUtils.clamp(stageT, 0, 1));
      buildState.fxMultiplier = e;

      for (let i = 0; i < sceneLights.managedLights.length; i++) {
        const ml = sceneLights.managedLights[i];
        ml.light.intensity = ml.baseIntensity * e;
      }
      for (let i = 0; i < sceneLights.managedEmissives.length; i++) {
        const me = sceneLights.managedEmissives[i];
        me.mat.emissiveIntensity = me.baseIntensity * e;
      }
    }

    function evaluateBuildPlaybackAt(timeSec) {
      let acc = 0;
      let activeStage = 0;

      for (let s = 0; s < 7; s++) {
        const dur = buildState.stageDurations[s];
        const stageT = THREE.MathUtils.clamp((timeSec - acc) / dur, 0, 1);
        if (timeSec >= acc) activeStage = s;
        if (s < 6) {
          applyBuildStageProgress(s, stageT);
        } else {
          applyLightAndFxStage(stageT);
        }
        acc += dur;
      }

      const pct = Math.min(100, Math.round((timeSec / buildState.totalDuration) * 100));
      updateBuildToastUI(BUILD_STAGE_NAMES[activeStage], pct, true);
    }

    function resetAllToComplete() {
      for (let s = 0; s < 6; s++) applyBuildStageProgress(s, 1);
      applyLightAndFxStage(1);
    }

    // =========================================================================
    // 14. HUD INTERACTION WIRING
    // =========================================================================
    const uiRefs = {
      dock: document.getElementById('hud-dock'),
      toast: document.getElementById('build-toast'),
      toastM: document.getElementById('build-toast-mobile'),
      stageLabel: document.getElementById('build-stage-label'),
      stageLabelM: document.getElementById('build-stage-label-m'),
      percent: document.getElementById('build-percent'),
      percentM: document.getElementById('build-percent-m'),
      progressBar: document.getElementById('build-progress-bar'),
      progressBarM: document.getElementById('build-progress-bar-m'),
      btnPlay: document.getElementById('btn-build-play'),
      playIcon: document.getElementById('build-play-icon'),
      playText: document.getElementById('build-play-text'),
      btnReplay: document.getElementById('btn-build-replay'),
      btnToggleHud: document.getElementById('btn-toggle-hud'),
      iconEyeOpen: document.getElementById('icon-eye-open'),
      iconEyeClosed: document.getElementById('icon-eye-closed'),
      toggleHudText: document.getElementById('toggle-hud-text')
    };

    let isHudCollapsed = false;

    function updateBuildToastUI(label, pct, show) {
      uiRefs.stageLabel.textContent = label;
      uiRefs.stageLabelM.textContent = label;
      uiRefs.percent.textContent = `${pct}%`;
      uiRefs.percentM.textContent = `${pct}%`;
      uiRefs.progressBar.style.width = `${pct}%`;
      uiRefs.progressBarM.style.width = `${pct}%`;

      if (show && !isHudCollapsed) {
        uiRefs.toast.classList.remove('hud-hidden-top');
        uiRefs.toastM.classList.remove('hud-hidden-top');
      } else {
        uiRefs.toast.classList.add('hud-hidden-top');
        uiRefs.toastM.classList.add('hud-hidden-top');
      }
    }

    function syncPlayButtonUI() {
      if (buildState.mode === 'playing') {
        uiRefs.playIcon.textContent = '⏸';
        uiRefs.playText.textContent = '暂停播放';
        uiRefs.btnPlay.classList.remove('primary-play');
        uiRefs.btnPlay.classList.add('active-play');
        uiRefs.btnReplay.classList.remove('hidden');
      } else if (buildState.mode === 'paused') {
        uiRefs.playIcon.textContent = '▶';
        uiRefs.playText.textContent = '继续播放';
        uiRefs.btnPlay.classList.remove('active-play');
        uiRefs.btnPlay.classList.add('primary-play');
        uiRefs.btnReplay.classList.remove('hidden');
      } else {
        uiRefs.playIcon.textContent = '▶';
        uiRefs.playText.textContent = '建模播放';
        uiRefs.btnPlay.classList.remove('active-play');
        uiRefs.btnPlay.classList.add('primary-play');
        uiRefs.btnReplay.classList.add('hidden');
      }
    }

    function startBuildPlaybackFromStart() {
      buildState.mode = 'playing';
      buildState.time = 0;
      evaluateBuildPlaybackAt(0);
      syncPlayButtonUI();
    }

    function wireHUD() {
      // Camera viewpoint buttons
      const camBtns = document.querySelectorAll('.cam-btn');
      camBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          camBtns.forEach((b) => b.classList.remove('active-cam'));
          btn.classList.add('active-cam');
          transitionToView(btn.dataset.cam, false);
        });
      });

      // Weather buttons
      const weatherBtns = document.querySelectorAll('.weather-btn');
      weatherBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          weatherBtns.forEach((b) => b.classList.remove('active-weather'));
          btn.classList.add('active-weather');
          currentWeather = btn.dataset.weather;
          if (currentWeather === 'storm') {
            triggerLightningStrike(); // Immediate dramatic sky thunderbolt when entering thunderstorm
            lightningTimer = 2.4;
          }
          updateAtmosphereTargets();
        });
      });

      // Volcano FX buttons
      const volcanoBtns = document.querySelectorAll('.volcano-btn');
      volcanoBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          volcanoBtns.forEach((b) => b.classList.remove('active-volcano'));
          btn.classList.add('active-volcano');
          currentVolcano = btn.dataset.volcano;
          updateAtmosphereTargets();
        });
      });

      // Modeling Playback Play / Pause button
      uiRefs.btnPlay.addEventListener('click', () => {
        if (buildState.mode === 'idle') {
          startBuildPlaybackFromStart();
        } else if (buildState.mode === 'playing') {
          buildState.mode = 'paused';
          syncPlayButtonUI();
        } else if (buildState.mode === 'paused') {
          buildState.mode = 'playing';
          syncPlayButtonUI();
        }
      });

      // Replay button
      uiRefs.btnReplay.addEventListener('click', () => {
        startBuildPlaybackFromStart();
      });

      // Keyboard shortcuts: 1-4 = Weather, 5-7 = Volcano
      document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (key >= '1' && key <= '4') {
          const weatherMap = { '1': 'rain', '2': 'storm', '3': 'snow', '4': 'clear' };
          const target = weatherMap[key];
          if (target) {
            weatherBtns.forEach((b) => b.classList.remove('active-weather'));
            const matchBtn = document.querySelector(`.weather-btn[data-weather="${target}"]`);
            if (matchBtn) matchBtn.classList.add('active-weather');
            currentWeather = target;
            if (target === 'storm') {
              triggerLightningStrike();
              lightningTimer = 2.4;
            }
            updateAtmosphereTargets();
          }
        } else if (key >= '5' && key <= '7') {
          const volcanoMap = { '5': 'dormant', '6': 'active', '7': 'eruption' };
          const target = volcanoMap[key];
          if (target) {
            volcanoBtns.forEach((b) => b.classList.remove('active-volcano'));
            const matchBtn = document.querySelector(`.volcano-btn[data-volcano="${target}"]`);
            if (matchBtn) matchBtn.classList.add('active-volcano');
            currentVolcano = target;
            updateAtmosphereTargets();
          }
        }
      });

      // Collapsible HUD eye button
      uiRefs.btnToggleHud.addEventListener('click', () => {
        isHudCollapsed = !isHudCollapsed;
        uiRefs.dock.classList.toggle('hud-hidden', isHudCollapsed);
        uiRefs.iconEyeOpen.classList.toggle('hidden', isHudCollapsed);
        uiRefs.iconEyeClosed.classList.toggle('hidden', !isHudCollapsed);
        uiRefs.toggleHudText.textContent = isHudCollapsed ? '显示UI' : '隐藏UI';

        if (isHudCollapsed) {
          uiRefs.toast.classList.add('hud-hidden-top');
          uiRefs.toastM.classList.add('hud-hidden-top');
        } else if (buildState.mode !== 'idle') {
          uiRefs.toast.classList.remove('hud-hidden-top');
          uiRefs.toastM.classList.remove('hud-hidden-top');
        }
      });
    }

    // =========================================================================
    // 15. INITIALIZATION & MAIN 60FPS ANIMATION LOOP
    // =========================================================================
    function init() {
      try {
        renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: 'high-performance'
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.04;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        scene.background = initDynamicBackdrop();

        camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.5, 180);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.enablePan = false;
        controls.minPolarAngle = 0.25;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.75;

        // Cancel smooth camera transition if user manually grabs OrbitControls
        controls.addEventListener('start', () => {
          camAnim.active = false;
          controls.enableDamping = true;
        });

        try {
          composer = new EffectComposer(renderer);
          composer.addPass(new RenderPass(scene, camera));
          bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.32,
            0.46,
            0.88
          );
          composer.addPass(bloomPass);
          composer.addPass(new OutputPass());
        } catch (ppErr) {
          usePostProcessing = false;
        }

        // Build all 7 diorama stages & dynamic FX systems
        setupLighting();
        buildPedestal();
        buildStreetAndPuddles();
        buildMountFujiScene();
        buildVolcanoFX();
        buildConvenienceStore();
        buildStreetCornerProps();
        buildWeatherSystems();

        scene.add(dioramaRoot);
        updateAtmosphereTargets();
        updateResponsiveCamera(true);
        wireHUD();

        window.addEventListener('resize', () => updateResponsiveCamera(false));

        const clock = new THREE.Clock();

        function animate() {
          requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.05);
          const elapsed = clock.getElapsedTime();

          // 1) Modeling Playback Sequence Update
          if (buildState.mode === 'playing') {
            buildState.time += dt;
            if (buildState.time >= buildState.totalDuration) {
              buildState.time = buildState.totalDuration;
              resetAllToComplete();
              updateBuildToastUI('建模完成 · 全部细节已就绪', 100, true);
              buildState.mode = 'idle';
              syncPlayButtonUI();
              setTimeout(() => {
                if (buildState.mode === 'idle') {
                  updateBuildToastUI('', 100, false);
                }
              }, 1600);
            } else {
              evaluateBuildPlaybackAt(buildState.time);
            }
          }

          // 2) Silky Smooth Spherical Camera Viewpoint Easing
          if (camAnim.active) {
            camAnim.elapsed += dt;
            const t = Math.min(1, camAnim.elapsed / camAnim.duration);
            const e = easeInOutQuint(t);
            controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, e);

            const curSph = new THREE.Spherical(
              THREE.MathUtils.lerp(camAnim.startSph.radius, camAnim.endSph.radius, e),
              THREE.MathUtils.lerp(camAnim.startSph.phi, camAnim.endSph.phi, e),
              camAnim.startSph.theta + camAnim.dTheta * e
            );
            const offset = new THREE.Vector3().setFromSpherical(curSph);
            camera.position.copy(controls.target).add(offset);
            camera.lookAt(controls.target);

            if (t >= 1) {
              camAnim.active = false;
              controls.enableDamping = true;
            }
          }

          // 3) Weather, Lighting & Puddle FX
          updateWeatherAndLighting(dt, elapsed);

          // 4) Volcano Special Effects (Magma, Fissures, Toon Smoke, Embers, Lava Bombs, Tremor)
          updateVolcanoFX(dt, elapsed);

          // 5) Subtle Neon Sign Breathing & Dual AC Fan Rotation
          for (let i = 0; i < neonFlickerItems.length; i++) {
            const nf = neonFlickerItems[i];
            nf.mat.emissiveIntensity =
              (nf.base + Math.sin(elapsed * nf.speed) * nf.amp + Math.sin(elapsed * 19.3) * 0.025) *
              buildState.fxMultiplier;
          }
          for (let i = 0; i < acFanMeshes.length; i++) {
            acFanMeshes[i].rotation.x += dt * (7.2 + i * 1.4);
          }
          for (let i = 0; i < acVaneMeshes.length; i++) {
            acVaneMeshes[i].rotation.x = 0.25 + Math.sin(elapsed * 1.2 + i) * 0.28;
          }
          for (let i = 0; i < petAnimTargets.length; i++) {
            const pt = petAnimTargets[i];
            const t = elapsed + pt.phase;
            const blinkCycle = t % 3.6;
            const blinkScaleY = blinkCycle > 3.45 ? Math.max(0.12, Math.abs(Math.sin(((blinkCycle - 3.45) / 0.15) * Math.PI)) * -0.88 + 1.0) : 1.0;
            for (let e = 0; e < pt.eyes.length; e++) {
              pt.eyes[e].scale.y = blinkScaleY;
            }

            if (pt.kind === 'cat') {
              // Gentle breathing + curious look-around + periodic ear flick + beckoning paw wave
              const breath = 1.0 + Math.sin(t * 2.4) * 0.025;
              pt.animRoot.scale.set(1.0 / Math.sqrt(breath), breath, 1.0 / Math.sqrt(breath));
              pt.tail.rotation.y = Math.sin(t * 2.5) * 0.28;
              pt.tail.rotation.z = Math.cos(t * 1.8) * 0.10;
              pt.head.rotation.y = Math.sin(t * 0.85) * 0.24;
              pt.head.rotation.z = Math.sin(t * 1.4) * 0.09;
              pt.head.rotation.x = Math.sin(t * 1.1) * 0.05;

              const flick = Math.pow(Math.max(0, Math.sin(t * 2.3)), 16) * 0.28;
              pt.ears[0].pivot.rotation.z = pt.ears[0].baseZ - flick;
              pt.ears[1].pivot.rotation.z = pt.ears[1].baseZ + flick * 0.4;

              // Cute periodic招财猫-style welcoming paw wave
              const waveWindow = Math.max(0, Math.sin(t * 0.9));
              if (waveWindow > 0.2) {
                const wAmt = Math.min(1, (waveWindow - 0.2) / 0.35);
                pt.pawRight.rotation.x = (-1.15 + Math.sin(t * 7.2) * 0.28) * wAmt;
                pt.pawRight.rotation.z = -0.18 * wAmt;
              } else {
                pt.pawRight.rotation.x = THREE.MathUtils.lerp(pt.pawRight.rotation.x, 0, dt * 8);
                pt.pawRight.rotation.z = THREE.MathUtils.lerp(pt.pawRight.rotation.z, 0, dt * 8);
              }
            } else {
              // Happy Shiba puppy bounce, fast tail wag, curious head tilt & alternating paw tip-tap
              const bounce = Math.abs(Math.sin(t * 4.4)) * Math.max(0, Math.sin(t * 1.2));
              pt.animRoot.position.y = bounce * 0.045;
              pt.animRoot.scale.set(1.0 - bounce * 0.03, 1.0 + bounce * 0.045, 1.0 - bounce * 0.03);
              pt.tail.rotation.y = Math.sin(t * 9.5) * 0.42;
              pt.tail.rotation.z = Math.cos(t * 4.8) * 0.12;
              pt.head.rotation.y = Math.sin(t * 1.15) * 0.22;
              pt.head.rotation.z = Math.sin(t * 1.8) * 0.14;
              pt.head.rotation.x = -bounce * 0.10;

              const earPerk = bounce * 0.16;
              pt.ears[0].pivot.rotation.z = pt.ears[0].baseZ - earPerk;
              pt.ears[1].pivot.rotation.z = pt.ears[1].baseZ + earPerk;

              const tapAmp = Math.max(0, Math.sin(t * 1.2));
              pt.pawLeft.rotation.x = -Math.max(0, Math.sin(t * 8.8)) * 0.42 * tapAmp;
              pt.pawRight.rotation.x = -Math.max(0, -Math.sin(t * 8.8)) * 0.42 * tapAmp;
            }
          }

          controls.update();

          if (usePostProcessing && composer) {
            composer.render();
          } else {
            renderer.render(scene, camera);
          }
        }

        animate();
      } catch (err) {
        console.error('Diorama initialization error:', err);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
